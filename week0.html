<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fixed-width share graphic — desktop screenshot target, not a responsive page. -->
<meta name="viewport" content="width=1160">
<title>Week 0 Picks — PressBox Analytics</title>
<meta name="description" content="The PressBox graded board as a shareable card.">
<meta name="robots" content="noindex">

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0F0E0A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">

<style>
  /* ── Social share card in the site's dark language. Data comes from the
     public parlay board (graded legs only) — no sign-in, no sample data. ── */
  body {
    background: var(--cream-dark);
    font-family: var(--sans);
    margin: 0;
    padding: var(--space-8) 0 var(--space-16);
  }

  .wz-hint {
    width: 1080px;
    margin: 0 auto var(--space-3);
    font-size: var(--text-sm);
    color: var(--text-light);
  }
  .wz-hint a { color: var(--gold-deep); }

  .wz-card {
    width: 1080px;
    margin: 0 auto;
    background: var(--ink);
    color: var(--cream);
    overflow: hidden;
  }

  /* ── Header ── */
  .wz-head {
    padding: 48px 64px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .wz-logo img { height: 104px; width: auto; display: block; }
  .wz-head-right {
    text-align: right;
    padding-bottom: 10px;
    font-size: 15px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
  }
  .wz-title-block { padding: 26px 64px 0; }
  .wz-eyebrow {
    font-size: 17px;
    font-weight: var(--weight-bold);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .wz-title {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 92px;
    line-height: 1.02;
    color: var(--cream);
    margin: 2px 0 0;
  }
  .wz-sub {
    margin-top: 10px;
    font-size: 19px;
    color: var(--text-light);
  }
  .wz-sub strong { color: var(--gold-light); font-weight: var(--weight-bold); }
  .wz-rule {
    height: 4px;
    background: var(--gold);
    border: none;
    margin: 26px 64px 4px;
  }

  /* ── Picks ── */
  .wz-picks { padding: 6px 64px 14px; }
  .wz-row {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 17px 0;
  }
  .wz-row + .wz-row { border-top: 1px solid rgba(248, 245, 238, 0.13); }

  .wz-badge {
    flex-shrink: 0;
    width: 58px;
    height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    font-weight: var(--weight-bold);
    border-radius: var(--radius-md);
    border: 2px solid transparent;
  }
  .wz-badge--aplus { background: transparent; color: var(--gold-light); border-color: var(--gold); }
  .wz-badge--A     { background: var(--gold);   color: var(--ink); }
  .wz-badge--B     { background: var(--silver); color: var(--ink); }
  .wz-badge--C     { background: var(--bronze); color: var(--cream); }

  .wz-row-main { flex: 1; min-width: 0; }
  .wz-topline {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 14px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 3px;
  }
  .wz-topline .wz-mkt { color: var(--gold-light); }
  .wz-pick {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 37px;
    line-height: 1.08;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wz-pick .wz-num { color: var(--gold-light); }

  .wz-row-side {
    text-align: right;
    flex-shrink: 0;
    font-size: 16px;
    color: var(--text-light);
    line-height: 1.5;
  }
  .wz-row-side b { color: var(--cream); font-weight: var(--weight-semi); }

  .wz-more {
    text-align: center;
    padding: 12px 0 2px;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
  }

  .wz-note {
    margin: 54px 64px;
    padding: 44px;
    border: 1px solid rgba(248, 245, 238, 0.2);
    border-radius: var(--radius-md);
    text-align: center;
    font-size: 20px;
    color: var(--text-light);
  }
  .wz-note a { color: var(--gold-light); font-weight: var(--weight-semi); }

  /* ── Footer ── */
  .wz-foot {
    margin-top: 6px;
    padding: 24px 64px 38px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 4px solid var(--gold);
  }
  .wz-foot-url {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 26px;
    color: var(--gold-light);
  }
  .wz-foot-note {
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
  }
</style>
</head>
<body>

<div class="wz-hint">
  Screenshot the card below · <a href="/week0.html?week=1">?week=N</a> switches weeks.
</div>

<div class="wz-card">
  <div class="wz-head">
    <div class="wz-logo"><img src="/pressbox-w2a-ink-cropped.png" alt="PressBox Analytics"></div>
    <div class="wz-head-right">College Football · 2026</div>
  </div>
  <div class="wz-title-block">
    <div class="wz-eyebrow" id="wz-date">The Graded Board</div>
    <h1 class="wz-title" id="wz-title">Week 0</h1>
    <p class="wz-sub" id="wz-sub">&nbsp;</p>
  </div>
  <hr class="wz-rule">
  <div class="wz-picks" id="wz-picks"></div>
  <div class="wz-foot">
    <div class="wz-foot-url">pressboxanalytics.com</div>
    <div class="wz-foot-note">Board as of post time · lines move</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var API_BASE = 'https://betbuddy-backend.onrender.com';
  var SEASON = 2026;

  var params = new URLSearchParams(location.search);
  var WEEK = parseInt(params.get('week') || '0', 10);
  if (isNaN(WEEK)) WEEK = 0;
  // ?page=N -> 8 rows per page for a multi-image set; no param -> the whole
  // board on one tall card. ?per=N overrides the page size.
  var PAGE = parseInt(params.get('page') || '0', 10) || 0;
  var PER = parseInt(params.get('per') || '8', 10) || 8;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var TIER_SORT = { 'A+': 8, 'ml_pickem': 8, 'A': 7, 'B': 5, 'C': 4 };
  var BADGE = {
    'A+':        { label: 'A+', key: 'aplus' },
    'A':         { label: 'A',  key: 'A' },
    'B':         { label: 'B',  key: 'B' },
    'C':         { label: 'C',  key: 'C' },
    'ml_pickem': { label: 'ML', key: 'aplus' }
  };
  var MARKET_LABEL = { spread: 'Spread', total: 'Total', ml: 'Moneyline' };

  function kickoffParts(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return {
      day: d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/New_York' }),
      dayShort: d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'America/New_York' }),
      time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET',
      dateKey: d.toLocaleDateString('en-US', { timeZone: 'America/New_York' })
    };
  }

  function bestPrice(l) {
    // The picked side's juice at the credited book (spread/total only — an ML
    // line IS its price). The leg's other_books list carries per-book prices;
    // the is_best entry is the credited book.
    if (l.market === 'ml' || !Array.isArray(l.other_books)) return null;
    for (var i = 0; i < l.other_books.length; i++) {
      var b = l.other_books[i];
      if (b && b.is_best && b.price != null) return b.price;
    }
    return null;
  }

  function fmtAmerican(v) {
    var n = Number(v);
    if (isNaN(n)) return esc(v);
    return (n > 0 ? '+' : '') + n;
  }

  function renderRow(l, oneDay) {
    var m = BADGE[l.tier] || BADGE['C'];
    var kk = kickoffParts(l.kickoff);
    var kick = kk ? (oneDay ? kk.time : kk.dayShort + ' · ' + kk.time) : '';
    var bookName = esc((l.book && l.book.name) || '');
    var px = bestPrice(l);
    var pick;
    if (l.market === 'ml') {
      pick = esc(l.side) + ' ML <span class="wz-num">' + fmtAmerican(l.line) + '</span>';
    } else {
      pick = esc(l.side) + ' <span class="wz-num">' + esc(l.line) + '</span>';
    }
    var right = '<b>' + (px != null ? fmtAmerican(px) + ' · ' : '') + bookName + '</b>'
              + (kick ? '<br>' + esc(kick) : '');
    return '' +
      '<div class="wz-row">' +
        '<span class="wz-badge wz-badge--' + m.key + '">' + m.label + '</span>' +
        '<div class="wz-row-main">' +
          '<div class="wz-topline"><span class="wz-mkt">' + esc(MARKET_LABEL[l.market] || l.market) + '</span>' +
          '<span>' + esc(l.matchup || '') + '</span></div>' +
          '<div class="wz-pick">' + pick + '</div>' +
        '</div>' +
        '<div class="wz-row-side">' + right + '</div>' +
      '</div>';
  }

  function setSub(t) { document.getElementById('wz-sub').innerHTML = t; }
  function setPicks(h) { document.getElementById('wz-picks').innerHTML = h; }

  function render(legs) {
    document.getElementById('wz-title').textContent = 'Week ' + WEEK;
    document.title = 'Week ' + WEEK + ' Picks — PressBox Analytics';

    var graded = (legs || []).filter(function (l) {
      return l.side && BADGE[l.tier];
    });
    graded.sort(function (a, b) {
      var t = (TIER_SORT[b.tier] || 0) - (TIER_SORT[a.tier] || 0);
      if (t) return t;
      var k = String(a.kickoff || '').localeCompare(String(b.kickoff || ''));
      if (k) return k;
      return String(a.matchup || '').localeCompare(String(b.matchup || ''));
    });

    if (!graded.length) {
      setSub('No graded picks on the board yet.');
      setPicks('<div class="wz-note">The Week ' + WEEK + ' board hasn’t released — ' +
               '<a href="/live-lines.html">Live Lines</a> has the latest.</div>');
      return;
    }

    var dateKeys = {}, dayNames = {};
    graded.forEach(function (l) {
      var kk = kickoffParts(l.kickoff);
      if (kk) { dateKeys[kk.dateKey] = true; dayNames[kk.dateKey] = kk.day; }
    });
    var keys = Object.keys(dateKeys);
    var oneDay = keys.length === 1;
    document.getElementById('wz-date').textContent =
      oneDay ? dayNames[keys[0]] : 'The Graded Board';

    var counts = {};
    graded.forEach(function (l) {
      var label = l.tier === 'ml_pickem' ? 'A+' : l.tier;
      counts[label] = (counts[label] || 0) + 1;
    });
    var countText = ['A+', 'A', 'B', 'C'].filter(function (t) { return counts[t]; })
      .map(function (t) { return counts[t] + ' ' + t; }).join(' · ');
    setSub('<strong>' + graded.length + '</strong> graded pick' +
           (graded.length === 1 ? '' : 's') + (countText ? ' — ' + countText : ''));

    // The whole board on one card by default; ?page=N slices it into a
    // multi-image set (Austin, 2026-08-27: "i want all of them... or multiple").
    var shown = graded;
    if (PAGE > 0) {
      var pages = Math.max(1, Math.ceil(graded.length / PER));
      shown = graded.slice((PAGE - 1) * PER, PAGE * PER);
      if (pages > 1) {
        document.getElementById('wz-sub').innerHTML +=
          ' <span style="color:var(--text-light)">&middot; ' + PAGE + ' of ' + pages + '</span>';
      }
    }
    setPicks(shown.map(function (l) { return renderRow(l, oneDay); }).join(''));
  }

  fetch(API_BASE + '/parlay/board?season=' + SEASON + '&week=' + WEEK,
        { credentials: 'omit' })
    .then(function (res) {
      if (!res.ok) throw new Error('board HTTP ' + res.status);
      return res.json();
    })
    .then(function (payload) {
      if (payload.error) throw new Error(payload.error);
      render(payload.legs || []);
    })
    .catch(function (e) {
      setSub('The board didn’t load.');
      setPicks('<div class="wz-note">Feed error: ' + esc(e && e.message) +
               ' — reload to retry.</div>');
    });
})();
</script>

</body>
</html>
