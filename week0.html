<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Fixed-width share graphic — desktop screenshot target, not a responsive page. -->
<meta name="viewport" content="width=1160">
<title>Week 0 Picks — PressBox Analytics</title>
<meta name="description" content="The PressBox graded board as a shareable card.">
<meta name="robots" content="noindex">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta name="theme-color" content="#0F0E0A">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">

<style>
  /* ── Social share card, the site's DARK language: ink card, cream type,
     gold accents, serif display numbers. 1080px wide, ~4:5 for the feed.
     The card IS the deliverable — no site chrome. ── */
  body {
    background: var(--cream-dark);
    font-family: var(--sans);
    margin: 0;
    padding: var(--space-8) 0 var(--space-16);
  }

  .wz-hint {
    width: 1080px;
    margin: 0 auto var(--space-3);
    font-size: var(--text-sm);
    color: var(--text-light);
  }
  .wz-hint a { color: var(--gold-deep); }

  .wz-card {
    width: 1080px;
    min-height: 1350px;
    margin: 0 auto;
    background: var(--ink);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .wz-head {
    padding: 56px 72px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wz-logo img { height: 64px; width: auto; display: block; }
  .wz-head-right {
    text-align: right;
    font-size: 15px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
  }
  .wz-title-block { padding: 40px 72px 8px; }
  .wz-eyebrow {
    font-size: 17px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 6px;
  }
  .wz-title {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 96px;
    line-height: 1.0;
    color: var(--cream);
    margin: 0;
  }
  .wz-sub {
    margin-top: 14px;
    font-size: 19px;
    color: var(--text-light);
  }
  .wz-sub strong { color: var(--cream); font-weight: var(--weight-semi); }
  .wz-rule {
    height: 3px;
    background: var(--gold);
    border: none;
    margin: 34px 72px 0;
  }

  /* ── Picks ── */
  .wz-picks {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 8px 72px;
  }
  .wz-row {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 26px 0;
  }
  .wz-row + .wz-row { border-top: 1px solid rgba(248, 245, 238, 0.14); }

  .wz-badge {
    flex-shrink: 0;
    width: 64px;
    height: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: var(--weight-bold);
    border-radius: var(--radius-md);
    border: 2px solid transparent;
  }
  .wz-badge--aplus { background: transparent; color: var(--gold-light); border-color: var(--gold); }
  .wz-badge--A     { background: var(--gold);   color: var(--ink); }
  .wz-badge--B     { background: var(--silver); color: var(--ink); }
  .wz-badge--C     { background: var(--bronze); color: var(--cream); }

  .wz-row-main { flex: 1; min-width: 0; }
  .wz-matchup {
    font-size: 17px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .wz-pick {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 40px;
    line-height: 1.05;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wz-pick .wz-num { color: var(--gold-light); }
  .wz-meta {
    margin-top: 8px;
    font-size: 17px;
    color: var(--text-light);
  }
  .wz-meta b { color: var(--cream); font-weight: var(--weight-semi); }

  .wz-row-side {
    text-align: right;
    flex-shrink: 0;
  }
  .wz-market {
    display: inline-block;
    font-size: 14px;
    font-weight: var(--weight-semi);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--cream);
    border: 1px solid rgba(248, 245, 238, 0.35);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
  }
  .wz-kick {
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-light);
  }

  /* Message states */
  .wz-note {
    margin: 60px 72px;
    padding: 48px;
    border: 1px solid rgba(248, 245, 238, 0.2);
    border-radius: var(--radius-md);
    text-align: center;
    font-size: 20px;
    color: var(--text-light);
  }
  .wz-note a { color: var(--gold-light); font-weight: var(--weight-semi); }

  .wz-demo {
    display: inline-block;
    margin-left: 14px;
    font-size: 13px;
    font-weight: var(--weight-bold);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--gold-light);
    border-radius: var(--radius-sm);
    padding: 3px 10px;
    vertical-align: middle;
  }

  /* ── Footer ── */
  .wz-foot {
    padding: 30px 72px 44px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-top: 1px solid rgba(248, 245, 238, 0.14);
  }
  .wz-foot-url {
    font-family: var(--serif);
    font-weight: var(--weight-bold);
    font-size: 24px;
    color: var(--gold-light);
  }
  .wz-foot-note {
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-light);
  }
</style>
</head>
<body>

<div class="wz-hint">
  Screenshot the card below. <a href="/week0.html?week=1">?week=N</a> switches weeks ·
  <a href="/week0.html?demo=1">?demo=1</a> shows sample layout.
</div>

<div class="wz-card">
  <div class="wz-head">
    <div class="wz-logo"><img src="/pressbox-w2a-cream-cropped.png" alt="PressBox Analytics"></div>
    <div class="wz-head-right">College Football · 2026<span id="wz-demo-chip"></span></div>
  </div>
  <div class="wz-title-block">
    <div class="wz-eyebrow" id="wz-date">The Graded Board</div>
    <h1 class="wz-title" id="wz-title">Week 0</h1>
    <p class="wz-sub" id="wz-sub">&nbsp;</p>
  </div>
  <hr class="wz-rule">
  <div class="wz-picks" id="wz-picks"></div>
  <div class="wz-foot">
    <div class="wz-foot-url">pressboxanalytics.com</div>
    <div class="wz-foot-note">Board as of post time · lines move</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var API_BASE = 'https://betbuddy-backend.onrender.com';
  var SEASON = 2026;

  var params = new URLSearchParams(location.search);
  var WEEK = parseInt(params.get('week') || '0', 10);
  if (isNaN(WEEK)) WEEK = 0;
  var DEMO = parseInt(params.get('demo') || '0', 10) || 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var TIER_SORT = { 'A+': 8, 'ml_pickem': 8, 'A': 7, 'B': 5, 'C': 4 };
  var BADGE = {
    'A+':        { label: 'A+', key: 'aplus' },
    'A':         { label: 'A',  key: 'A' },
    'B':         { label: 'B',  key: 'B' },
    'C':         { label: 'C',  key: 'C' },
    'ml_pickem': { label: 'ML', key: 'aplus' }
  };
  var MARKET_LABEL = { spread: 'Spread', total: 'Total', ml: 'Moneyline' };

  // Session token straight from localStorage (the live-lines pattern).
  function tokenFromStorage() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('sb-') === 0 && k.slice(-11) === '-auth-token') {
          var v = JSON.parse(localStorage.getItem(k) || 'null');
          var tok = v && (v.access_token
                      || (v.currentSession && v.currentSession.access_token)
                      || (Array.isArray(v) && v[0]));
          if (tok) return tok;
        }
      }
    } catch (e) {}
    return null;
  }

  function kickoffParts(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return {
      day: d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/New_York' }),
      dayShort: d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'America/New_York' }),
      time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short', timeZone: 'America/New_York' })
        .replace(' EDT', ' ET').replace(' EST', ' ET'),
      dateKey: d.toLocaleDateString('en-US', { timeZone: 'America/New_York' })
    };
  }

  function pickText(p) {
    // The bet is the hero: "San José State +38.5" / "Under 48.5" / "Navy ML −112".
    var line = esc(p.line);
    if (p.market === 'ml') {
      return esc(p.side) + ' ML <span class="wz-num">' + line + '</span>';
    }
    return esc(p.side) + ' <span class="wz-num">' + line + '</span>';
  }

  function renderRow(p, oneDay) {
    var m = BADGE[p.tier];
    var kk = kickoffParts(p.kickoff);
    var kick = kk ? (oneDay ? kk.time : kk.dayShort + ' · ' + kk.time) : '';
    var bookName = esc((p.book && p.book.name) || '');
    var px = (p.market !== 'ml' && p.price) ? esc(p.price) + ' at ' : '';
    var meta = (px || bookName)
      ? '<div class="wz-meta">' + (p.market !== 'ml' && p.price ? '<b>' + esc(p.price) + '</b> at ' : '') + bookName + '</div>'
      : '';
    return '' +
      '<div class="wz-row">' +
        '<span class="wz-badge wz-badge--' + m.key + '">' + m.label + '</span>' +
        '<div class="wz-row-main">' +
          '<div class="wz-matchup">' + esc(p.matchup || '') + '</div>' +
          '<div class="wz-pick">' + pickText(p) + '</div>' +
          meta +
        '</div>' +
        '<div class="wz-row-side">' +
          '<span class="wz-market">' + esc(MARKET_LABEL[p.market] || p.market) + '</span>' +
          (kick ? '<div class="wz-kick">' + esc(kick) + '</div>' : '') +
        '</div>' +
      '</div>';
  }

  function setSub(t) { document.getElementById('wz-sub').innerHTML = t; }
  function setPicks(h) { document.getElementById('wz-picks').innerHTML = h; }

  function render(picks) {
    document.getElementById('wz-title').textContent = 'Week ' + WEEK;
    document.title = 'Week ' + WEEK + ' Picks — PressBox Analytics';

    var graded = picks.filter(function (p) {
      return p.week === WEEK && p.side && p.side !== '?' && BADGE[p.tier];
    });
    graded.sort(function (a, b) {
      var t = (TIER_SORT[b.tier] || 0) - (TIER_SORT[a.tier] || 0);
      if (t) return t;
      var k = String(a.kickoff || '').localeCompare(String(b.kickoff || ''));
      if (k) return k;
      return String(a.matchup || '').localeCompare(String(b.matchup || ''));
    });

    if (!graded.length) {
      setSub('No graded picks on the board yet.');
      setPicks('<div class="wz-note">The Week ' + WEEK + ' board hasn’t released — ' +
               '<a href="/live-lines.html">Live Lines</a> has the latest.</div>');
      return;
    }

    var dateKeys = {}, dayNames = {};
    graded.forEach(function (p) {
      var kk = kickoffParts(p.kickoff);
      if (kk) { dateKeys[kk.dateKey] = true; dayNames[kk.dateKey] = kk.day; }
    });
    var keys = Object.keys(dateKeys);
    var oneDay = keys.length === 1;
    document.getElementById('wz-date').textContent =
      oneDay ? dayNames[keys[0]] : 'The Graded Board';

    var counts = {};
    graded.forEach(function (p) {
      var label = p.tier === 'ml_pickem' ? 'A+' : p.tier;
      counts[label] = (counts[label] || 0) + 1;
    });
    var countText = ['A+', 'A', 'B', 'C'].filter(function (t) { return counts[t]; })
      .map(function (t) { return counts[t] + ' ' + t; }).join(' · ');
    setSub('<strong>' + graded.length + '</strong> graded pick' +
           (graded.length === 1 ? '' : 's') + (countText ? ' — ' + countText : ''));

    // The card is designed for up to ~7 rows; past that, keep the best.
    var MAXROWS = 7;
    var shown = graded.slice(0, MAXROWS);
    var extra = graded.length - shown.length;
    var html = shown.map(function (p) { return renderRow(p, oneDay); }).join('');
    if (extra > 0) {
      html += '<div class="wz-meta" style="text-align:center;padding:10px 0 4px;">+ ' +
              extra + ' more on the board</div>';
    }
    setPicks(html);
  }

  // ── Demo fixtures — fictional numbers for layout checks only ──
  function demoPicks() {
    return [
      { week: WEEK, tier: 'A+', market: 'spread', matchup: 'Kansas State vs Iowa State', side: 'Kansas State', line: '-2.5', price: '-105', book: { name: 'DraftKings' }, kickoff: '2026-08-29T16:00:00Z' },
      { week: WEEK, tier: 'A',  market: 'total',  matchup: 'Sam Houston vs Western Kentucky', side: 'Under', line: '48.5', price: '-110', book: { name: 'FanDuel' }, kickoff: '2026-08-29T23:00:00Z' },
      { week: WEEK, tier: 'B',  market: 'ml',     matchup: 'Stanford vs Hawaiʻi', side: 'Stanford', line: '-146', book: { name: 'BetMGM' }, kickoff: '2026-08-30T03:00:00Z' },
      { week: WEEK, tier: 'C',  market: 'spread', matchup: 'Fresno State vs Kansas', side: 'Fresno State', line: '+7', price: '-108', book: { name: 'Caesars' }, kickoff: '2026-08-30T00:30:00Z' },
      { week: WEEK, tier: 'C',  market: 'total',  matchup: 'FIU vs Bethune-Cookman', side: 'Over', line: '61.5', price: '-112', book: { name: 'Bovada' }, kickoff: '2026-08-29T20:00:00Z' }
    ];
  }

  function boot() {
    if (DEMO) {
      document.getElementById('wz-demo-chip').innerHTML =
        '<span class="wz-demo">Sample</span>';
      render(demoPicks());
      return;
    }
    var token = tokenFromStorage();
    var headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    fetch(API_BASE + '/canonical/live-lines/feed?season=' + SEASON,
          { credentials: 'omit', headers: headers })
      .then(function (res) {
        if (res.status === 401 || res.status === 402) throw new Error('auth');
        if (!res.ok) throw new Error('feed HTTP ' + res.status);
        return res.json();
      })
      .then(function (payload) {
        if (payload.error) throw new Error(payload.error);
        render(payload.picks || []);
      })
      .catch(function (e) {
        var authy = String(e && e.message) === 'auth' || !token;
        setSub(authy ? 'Sign in to load the board.' : 'The board didn’t load.');
        setPicks('<div class="wz-note">' +
          (authy
            ? 'This card renders your live board. <a href="/live-lines.html">Sign in on Live Lines</a>, then reload this page.'
            : 'Feed error: ' + esc(e && e.message) + ' — reload to retry.') +
          '</div>');
      });
  }

  boot();
})();
</script>

</body>
</html>
