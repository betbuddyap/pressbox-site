<style>
  /* ── Site nav (copy of live-lines nav — keep in sync) ── */
  nav { background: var(--cream); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .nav-logo img { height: 68px; width: auto; display: block; }
  .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .nav-links a { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-mid); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }

  .nav-links a.nav-live {
    color: var(--rust) !important;
    font-weight: 700;
    letter-spacing: 0.3px;
    position: relative;
    text-transform: uppercase;
    font-size: 11px;
  }
  .nav-links a.nav-live::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--rust);
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: 2px;
    animation: pulse-live 2.4s ease-in-out infinite;
  }
  .nav-links a.nav-live:hover { color: var(--rust-light) !important; }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .mobile-menu a.nav-live-mobile { color: var(--rust) !important; }

  .hamburger { display: none; flex-direction: column !important; align-items: center; justify-content: center; gap: 4px; background: none; border: none; padding: 8px; cursor: pointer; }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--ink); }
  .mobile-menu { display: none; position: fixed; inset: 0; background: var(--cream); z-index: 200; padding: 80px 32px; flex-direction: column; gap: 24px; }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { color: var(--ink); text-decoration: none; font-size: 22px; font-family: var(--serif); }
  .mobile-menu .close-btn { position: absolute; top: 24px; right: 24px; font-size: 28px; background: none; border: none; color: var(--ink); line-height: 1; cursor: pointer; }
  @media (min-width: 961px) { .hamburger { display: none !important; } }
  @media (max-width: 960px) { .nav-links { display: none; } .hamburger { display: flex; } }

  /* ── Results as Live Lines of past games ── */
  .rs-head { margin: 44px 0 28px; }
  .rs-eyebrow { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi);
                text-transform: uppercase; letter-spacing: 0.03em; color: var(--gold); margin-bottom: 10px; }
  .rs-title { font-family: var(--serif); font-weight: var(--weight-bold); color: var(--ink);
              font-size: clamp(30px, 4.5vw, 42px); margin: 0 0 12px; }
  .rs-sub { font-family: var(--sans); font-size: var(--text-base); color: var(--text-mid);
            line-height: 1.55; max-width: 640px; margin: 0; }
  .rs-record { font-family: var(--sans); font-size: var(--text-sm); font-weight: var(--weight-semi);
               color: var(--text-mid); margin-top: 14px; }
  .rs-game { display: block; text-decoration: none; color: inherit;
             padding: var(--space-4); margin-bottom: var(--space-3); }
  .rs-game:hover { border-color: var(--gold); }
  .rs-game-head { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 12px; margin-bottom: var(--space-2); }
  .rs-matchup { font-family: var(--sans); font-size: var(--text-base); font-weight: var(--weight-semi); color: var(--ink); }
  .rs-headright { white-space: nowrap; }
  .rs-final { font-family: var(--serif); font-style: italic; font-weight: var(--weight-bold);
              color: var(--gold); font-size: var(--text-sm); margin-right: 6px; }
  .rs-score { font-family: var(--sans); font-weight: var(--weight-bold); color: var(--ink); }
  .rs-pick { display: flex; align-items: center; gap: var(--space-3);
             padding: 8px 0; border-top: 0.5px solid var(--cream-mid); }
  .rs-pick--ne { opacity: 0.75; }
  .rs-pick-mkt { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi);
                 text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid);
                 flex: 0 0 76px; }
  .rs-mark { margin-left: auto; font-family: var(--sans); font-weight: var(--weight-bold); font-size: 15px; }
  .rs-mark--win  { color: var(--sage); }
  .rs-mark--loss { color: var(--rust); }
  .rs-mark--push { color: var(--text-mid); }
  /* ── Hero card — the My Bets P&L card, verbatim (Austin: "build the top
     portion like my bets"). Dark ink card, serif display numbers. ── */
  .rs-hero { background: var(--ink); border-radius: 6px; padding: 32px 36px 28px;
             color: var(--cream); margin-bottom: var(--space-4); }
  .rs-hero-top { display: flex; align-items: baseline; justify-content: space-between;
                 gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .rs-hero-eyebrow { font-family: var(--sans); font-size: 9px; font-weight: 600;
                     letter-spacing: 0.03em; text-transform: uppercase; color: var(--gold-light); }
  .rs-hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  @media (max-width: 720px) { .rs-hero-stats { grid-template-columns: repeat(2, 1fr); row-gap: 20px; } }
  .rs-stat-label { font-family: var(--sans); font-size: 11px; font-weight: 600;
                   letter-spacing: 0.02em; text-transform: uppercase;
                   color: rgba(248,245,238,0.72); margin-bottom: 6px; }
  .rs-stat-value { font-family: var(--serif); font-size: 34px; font-weight: 700;
                   line-height: 1; color: var(--cream); }
  .rs-stat-value.pos { color: var(--sage); }
  .rs-stat-value.neg { color: var(--rust-light, var(--rust)); }
  .rs-hero-note { font-family: var(--sans); font-size: 11px; color: rgba(248,245,238,0.45);
                  margin-top: 22px; line-height: 1.5; }
  .rs-empty { font-family: var(--sans); color: var(--text-mid); padding: 72px 24px; line-height: 1.6;
              max-width: 560px; margin: 0 auto; text-align: center; }
  /* The visible way into the game page — the whole card navigates, but the
   * link has to LOOK like a link (Austin: found it only by accident). */
  .rs-goto { margin-top: var(--space-2); padding-top: 8px; border-top: 0.5px solid var(--cream-mid);
             font-family: var(--sans); font-size: var(--text-sm); font-weight: var(--weight-semi);
             color: var(--gold); text-align: right; }
  .rs-game:hover .rs-goto { text-decoration: underline; }
</style>
</head>
