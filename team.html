<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); min-height: 100vh; }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* HERO (rankings page-header idiom, painted in the TEAM'S color — Austin
     9/7). JS sets the --hero-* props from /teams/colors with a luminance
     guard: bright primaries flip the foreground to ink. Ink defaults. */
  .page-header { background: var(--hero-bg, var(--ink)); padding: 52px 0 40px; }
  .page-header-inner { max-width: var(--max); margin: 0 auto; padding: 0 32px; }
  .page-eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--hero-acc, var(--gold)); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .page-eyebrow::before { content: ''; display: block; width: 20px; height: 1px; background: var(--hero-acc, var(--gold)); }
  .page-eyebrow a { color: var(--hero-acc, var(--gold)); text-decoration: none; }
  .page-eyebrow a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .page-title { font-family: var(--serif); font-size: 42px; font-weight: 700; color: var(--hero-fg, var(--cream)); line-height: 1.1; }
  .tm-accent { width: 64px; height: 4px; border-radius: 2px; background: var(--hero-bar, var(--gold)); margin-top: 14px; }
  .page-sub { font-size: 14px; font-weight: 300; color: var(--hero-dim, #8A8A76); margin-top: 10px; }

  /* Hero stat strip — display numbers are SERIF (house number rule) */
  .tm-stats { display: flex; gap: 44px; flex-wrap: wrap; margin-top: 28px; }
  .tm-stat-lab { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--hero-dim, #8A8A76); margin-bottom: 6px; }
  .tm-stat-val { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--hero-fg, var(--cream)); font-variant-numeric: tabular-nums; line-height: 1; }
  .tm-stat-val .of { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--hero-dim, #8A8A76); margin-left: 4px; }

  /* MAIN */
  .tm-main { max-width: var(--max); margin: 0 auto; padding: 36px 32px 80px; }
  .tm-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 36px; }
  @media (max-width: 880px) { .tm-grid { grid-template-columns: 1fr; } }
  .tm-sect-h { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .tm-sect-h .note { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text-light); font-size: var(--text-sm); }

  /* SCHEDULE (rankings rk-gm idiom, widened) */
  .tm-sched { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--cream); overflow: hidden; }
  .tm-gm { display: grid; grid-template-columns: 96px 1fr auto 30px; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px dashed var(--border); text-decoration: none; transition: background var(--transition-fast); }
  .tm-gm:last-child { border-bottom: none; }
  a.tm-gm:hover { background: var(--cream-dark); }
  .tm-gm-when { min-width: 0; }
  .tm-gm-date { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--text); }
  .tm-gm-time { display: block; font-family: var(--sans); font-size: var(--text-micro); font-weight: 500; color: var(--text-light); margin-top: 1px; }
  .tm-gm-opp { min-width: 0; }
  .tm-gm-opp-name { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm-gm-opp-name .site { color: var(--text-light); font-weight: 500; }
  .tm-gm-opp-name .oppr { color: var(--gold-deep); font-weight: 700; }
  .tm-gm-meta { font-family: var(--sans); font-size: var(--text-micro); font-weight: 500; color: var(--text-light); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tm-tv { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: rgba(26,23,5,0.07); color: var(--text-mid); }
  .tm-reason { font-size: 8px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 1px 4px; border-radius: 3px; background: rgba(176,124,18,0.14); color: #8A5E00; }
  .tm-reason-pos { background: rgba(46,107,62,0.14); color: #2E6B3E; }
  .tm-gm-num { text-align: right; }
  .tm-gm-wp { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tm-gm-cx { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-light); text-transform: uppercase; margin-top: 1px; }
  .cx-lock    { color: #2E6B3E; }
  .cx-favored { color: var(--text-light); }
  .cx-lean    { color: #B07C12; }
  .cx-tossup  { color: #C0561C; }
  .cx-loss    { color: var(--text-light); }
  .cx-final   { color: var(--gold); }
  .tm-wl { font-family: var(--sans); font-size: 11px; font-weight: 800; text-align: center; border-radius: var(--radius-md); padding: 3px 0; }
  .tm-wl-w { background: rgba(46,107,62,0.14); color: #2E6B3E; }
  .tm-wl-l { background: rgba(26,23,5,0.06); color: var(--text-light); }
  .tm-gm.is-danger { background: rgba(176,124,18,0.05); box-shadow: inset 2px 0 0 #B07C12; }
  .tm-gm.is-tossup { background: rgba(192,86,28,0.06); box-shadow: inset 2px 0 0 #C0561C; }
  .tm-gm.is-final .tm-gm-wp { color: var(--ink); }

  /* THE FOUR SIGNALS (rankings rk-model idiom) */
  .tm-panel { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--cream); padding: 18px 16px; }
  .tm-model { display: grid; grid-template-columns: 64px 1fr 52px; align-items: center; gap: 12px; margin-bottom: 9px; }
  .tm-model:last-child { margin-bottom: 0; }
  .tm-model-name { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--text-mid); }
  .tm-model.is-blend .tm-model-name { color: var(--gold); font-weight: 700; }
  .tm-model-track { position: relative; height: 6px; background: rgba(26,23,5,0.07); border-radius: 3px; }
  .tm-model-zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(26,23,5,0.25); }
  .tm-model-fill { position: absolute; top: 0; height: 6px; border-radius: 3px; background: var(--text-mid); }
  .tm-model.is-blend .tm-model-fill { background: var(--gold); }
  .tm-model-val { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }

  /* Context rows (rankings rk-kv idiom) */
  .tm-kv { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .tm-kv:last-child { border-bottom: none; }
  .tm-kv-k { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--text-mid); }
  .tm-kv-v { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tm-side-stack > * + * { margin-top: 24px; }

  /* WHO MOVES THE NEEDLE (player leaders — rankings panel idiom) */
  .tm-pgroup { margin-top: 16px; }
  .tm-pgroup:first-child { margin-top: 0; }
  .tm-pgroup-h { font-family: var(--sans); font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .tm-prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .tm-prow:last-child { border-bottom: none; }
  .tm-prow-name { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); }
  .tm-prow-name .pos { font-size: var(--text-micro); font-weight: 600; color: var(--text-light); margin-left: 6px; }
  .tm-prow-sub { font-family: var(--sans); font-size: var(--text-micro); font-weight: 500; color: var(--text-light); margin-top: 2px; }
  .tm-prow-val { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tm-prow-val .lab { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-light); }
  .tm-players-empty { font-family: var(--sans); font-size: 12px; color: var(--text-light); line-height: 1.6; }

  /* STATES */
  .tm-state { text-align: center; padding: 80px 24px; }
  .tm-state-title { font-family: var(--serif); font-size: var(--text-xl); font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .tm-state-sub { font-family: var(--sans); font-size: 14px; color: var(--text-light); line-height: 1.6; }
  .tm-state-sub a { color: var(--gold-deep); font-weight: 600; text-decoration: none; }
  .tm-skel { height: 56px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, rgba(26,23,5,0.03) 25%, rgba(26,23,5,0.06) 50%, rgba(26,23,5,0.03) 75%); background-size: 200% 100%; animation: tm-shimmer 1.3s ease-in-out infinite; }
  @keyframes tm-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  @media (max-width: 720px) {
    .page-header { padding: 34px 0 26px; }
    .page-header-inner { padding: 0 18px; }
    .page-title { font-size: 30px; }
    .tm-stats { gap: 22px; margin-top: 20px; }
    .tm-stat-val { font-size: 24px; }
    .tm-main { padding: 22px 18px 64px; }
    .tm-gm { grid-template-columns: 88px 1fr auto 26px; gap: 8px; padding: 10px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .tm-skel { animation: none; } }
</style>
</head>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="pressbox-w2a-cream-cropped.png" alt="PressBox Analytics" style="height:68px;width:auto;display:block;">
    </a>
  </div>
</nav>

<!-- HERO -->
<div class="page-header">
  <div class="page-header-inner">
    <div class="page-eyebrow" id="tmEyebrow"><a href="/teams.html">Teams</a></div>
    <h1 class="page-title" id="tmTitle">&nbsp;</h1>
    <div class="tm-accent" id="tmAccent"></div>
    <div class="tm-stats" id="tmStats"></div>
  </div>
</div>

<!-- MAIN -->
<main class="tm-main">
  <div id="tmBody">
    <div class="tm-skel"></div><div class="tm-skel"></div><div class="tm-skel"></div>
    <div class="tm-skel"></div><div class="tm-skel"></div><div class="tm-skel"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth-nav.js" defer></script>
<script>
const API = 'https://betbuddy-backend.onrender.com';
const SEASON = 2026;
const TEAM = new URLSearchParams(location.search).get('team') || '';

const MODEL_ORDER = [
  { key: 'sp',   label: 'SP+' },
  { key: 'ppa',  label: 'PPA' },
  { key: 'adv',  label: 'Advanced' },
  { key: 'pace', label: 'Pace+' },
];
// A rest edge helps — green chip, same rule as the rankings page.
const POSITIVE_SPOTS = new Set(['rested', 'off bye']);

const els = {
  eyebrow: document.getElementById('tmEyebrow'),
  title:   document.getElementById('tmTitle'),
  accent:  document.getElementById('tmAccent'),
  stats:   document.getElementById('tmStats'),
  body:    document.getElementById('tmBody'),
};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtSigned(v) {
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(1);
}

// Kick display, ET. CFBD gives TBD games a placeholder that lands on
// midnight ET — show the date and say TBD instead of inventing a time.
function kickParts(iso) {
  if (!iso) return { date: 'TBD', time: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { date: 'TBD', time: '' };
  const date = d.toLocaleDateString('en-US',
    { weekday: 'short', month: 'numeric', day: 'numeric', timeZone: 'America/New_York' });
  const hm = d.toLocaleTimeString('en-US',
    { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
  const mid = d.toLocaleTimeString('en-US',
    { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/New_York' }) === '00:00';
  return { date, time: mid ? 'TBD' : hm + ' ET' };
}

function notFound(msg) {
  els.title.textContent = 'Team not found';
  els.body.innerHTML = `<div class="tm-state">
    <div class="tm-state-title">${escapeHtml(msg)}</div>
    <div class="tm-state-sub">Pick a team from <a href="/teams.html">the directory</a>.</div></div>`;
}

// Paint the hero in the team's primary color (Austin 9/7). Bright
// primaries (Tennessee orange, Baylor gold) flip the text to ink via a
// relative-luminance guard; missing/odd colors leave the ink default.
function paintHero(c) {
  const hex = c && /^#?[0-9a-f]{6}$/i.test(c.primary || '')
    ? (c.primary[0] === '#' ? c.primary : '#' + c.primary) : null;
  if (!hex) return;
  const ch = i => parseInt(hex.slice(i, i + 2), 16);
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const lum = 0.2126 * lin(ch(1)) + 0.7152 * lin(ch(3)) + 0.0722 * lin(ch(5));
  const light = lum > 0.35;
  const darker = '#' + [1, 3, 5].map(i =>
    Math.round(ch(i) * 0.72).toString(16).padStart(2, '0')).join('');
  const hdr = document.querySelector('.page-header');
  hdr.style.setProperty('--hero-bg', `linear-gradient(150deg, ${hex} 0%, ${darker} 100%)`);
  hdr.style.setProperty('--hero-fg', light ? 'var(--ink)' : 'var(--cream)');
  hdr.style.setProperty('--hero-dim', light ? 'rgba(15,14,10,0.62)' : 'rgba(248,245,238,0.62)');
  hdr.style.setProperty('--hero-acc', light ? 'rgba(15,14,10,0.85)' : 'var(--gold-light)');
  const alt = c.alt && /^#?[0-9a-f]{6}$/i.test(c.alt)
    ? (c.alt[0] === '#' ? c.alt : '#' + c.alt) : null;
  hdr.style.setProperty('--hero-bar',
    (alt && alt.toLowerCase() !== hex.toLowerCase()) ? alt
      : light ? 'var(--ink)' : 'var(--cream)');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', hex);
}

function modelRow(name, v, isBlend, maxAbs) {
  let fill = '';
  if (v != null && isFinite(v)) {
    const half = Math.min(50, Math.abs(v) / maxAbs * 50);
    const left = v >= 0 ? 50 : 50 - half;
    fill = `<span class="tm-model-fill" style="left:${left}%;width:${half}%;"></span>`;
  }
  return `
    <div class="tm-model${isBlend ? ' is-blend' : ''}">
      <span class="tm-model-name">${escapeHtml(name)}</span>
      <span class="tm-model-track"><span class="tm-model-zero" style="left:50%;"></span>${fill}</span>
      <span class="tm-model-val">${v == null ? '—' : fmtSigned(v)}</span>
    </div>`;
}

function render(p, colors) {
  const teams = (p.teams || []).slice().sort((a, b) => b.rating - a.rating);
  const t = teams.find(x => x.team === TEAM)
    || teams.find(x => x.team.toLowerCase() === TEAM.toLowerCase());
  if (!t) { notFound(`No FBS team called “${TEAM}” on the board.`); return; }

  const rankOf = {}, confOf = {};
  teams.forEach((x, i) => { rankOf[x.team] = i + 1; confOf[x.team] = x.conference; });
  const confSize = teams.filter(x => x.conference === t.conference).length;

  // Records off the locked season rows.
  const season = Array.isArray(t.season) ? t.season : [];
  const played = season.filter(g => g.played);
  const rec = `${played.filter(g => g.result === 'W').length}-${played.filter(g => g.result === 'L').length}`;
  const confPlayed = played.filter(g => confOf[g.opp] === t.conference);
  const confRec = `${confPlayed.filter(g => g.result === 'W').length}-${confPlayed.filter(g => g.result === 'L').length}`;

  // Hero
  document.title = `${t.team} — PressBox Analytics`;
  els.eyebrow.innerHTML = `<a href="/teams.html">Teams</a> · ${escapeHtml(t.conference || 'FBS')} · ${SEASON}`;
  els.title.textContent = t.team;
  const c = colors && colors.teams && colors.teams[t.team];
  paintHero(c);
  els.stats.innerHTML = `
    <div><div class="tm-stat-lab">National</div><div class="tm-stat-val">#${rankOf[t.team]}<span class="of">of ${teams.length}</span></div></div>
    <div><div class="tm-stat-lab">Record</div><div class="tm-stat-val">${rec}</div></div>
    <div><div class="tm-stat-lab">${escapeHtml(t.conference || 'Conference')}</div><div class="tm-stat-val">#${t.rating_conf_rank || '—'}<span class="of">of ${confSize}</span></div></div>
    <div><div class="tm-stat-lab">In conference</div><div class="tm-stat-val">${confRec}</div></div>
    <div><div class="tm-stat-lab">Rating</div><div class="tm-stat-val">${t.rating == null ? '—' : t.rating.toFixed(1)}</div></div>`;

  // Schedule rows
  const gmHTML = g => {
    const k = kickParts(g.kick);
    const oppRank = !g.fcs && rankOf[g.opp] && rankOf[g.opp] <= 25 ? `<span class="oppr">#${rankOf[g.opp]}</span> ` : '';
    const site = g.site === 'home' ? 'vs' : g.site === 'away' ? 'at' : 'vs';
    const neutral = g.site === 'neutral' ? ' <span class="site">· neutral</span>' : '';
    const meta = [
      g.tv ? `<span class="tm-tv">${escapeHtml(g.tv)}</span>` : '',
      g.fcs ? `<span class="tm-tv">FCS</span>` : '',
      ...(Array.isArray(g.reasons) ? g.reasons.map(r =>
        `<span class="tm-reason${POSITIVE_SPOTS.has(r) ? ' tm-reason-pos' : ''}">${escapeHtml(r)}</span>`) : []),
    ].filter(Boolean).join('');
    let num, pill;
    if (g.played) {
      num = `<span class="tm-gm-wp">${escapeHtml(g.score || '')}</span><span class="tm-gm-cx cx-final">Final</span>`;
      pill = `<span class="tm-wl ${g.result === 'W' ? 'tm-wl-w' : 'tm-wl-l'}">${g.result}</span>`;
    } else {
      const wp = isFinite(g.win_prob) ? Math.round(g.win_prob * 100) + '%' : '—';
      num = `<span class="tm-gm-wp">${wp}</span><span class="tm-gm-cx cx-${escapeHtml(g.risk || '')}">${escapeHtml(g.complexion || '')}</span>`;
      pill = '';
    }
    const cls = 'tm-gm' + (g.played ? ' is-final' : g.danger ? ' is-danger' : g.risk === 'tossup' ? ' is-tossup' : '');
    const inner = `
      <span class="tm-gm-when">
        <span class="tm-gm-date">${escapeHtml(k.date.replace(',', ''))}</span>
        <span class="tm-gm-time">${escapeHtml(k.time)}</span>
      </span>
      <span class="tm-gm-opp">
        <span class="tm-gm-opp-name"><span class="site">${site}</span> ${oppRank}${escapeHtml(g.opp)}${neutral}</span>
        ${meta ? `<span class="tm-gm-meta">${meta}</span>` : ''}
      </span>
      <span class="tm-gm-num">${num}</span>
      ${pill || '<span></span>'}`;
    return g.game_id
      ? `<a class="${cls}" href="/game.html?id=${encodeURIComponent(g.game_id)}">${inner}</a>`
      : `<div class="${cls}">${inner}</div>`;
  };

  // The four signals + context
  const models = t.models || {};
  const modelVals = MODEL_ORDER.map(m => models[m.key]).filter(v => v != null);
  const maxAbs = Math.max(10, ...teams.map(x => Math.abs(x.rating || 0)));
  const modelRows = MODEL_ORDER.map(m => modelRow(m.label, models[m.key], false, maxAbs)).join('')
    + modelRow('Blend', models.blend != null ? models.blend : t.rating, true, maxAbs);
  const variance = modelVals.length >= 2
    ? (Math.max(...modelVals) - Math.min(...modelVals)) : null;
  const sosRank = teams.slice().sort((a, b) => (b.sos ?? -99) - (a.sos ?? -99))
    .findIndex(x => x.team === t.team) + 1;

  els.body.innerHTML = `
    <div class="tm-grid">
      <section>
        <div class="tm-sect-h">Schedule <span class="note">win probabilities off the current board</span></div>
        <div class="tm-sched">${season.map(gmHTML).join('')}</div>
      </section>
      <section class="tm-side-stack">
        <div>
          <div class="tm-sect-h">The four signals</div>
          <div class="tm-panel">${modelRows}</div>
        </div>
        <div>
          <div class="tm-sect-h">Season outlook</div>
          <div class="tm-panel">
            <div class="tm-kv"><span class="tm-kv-k">Projected record</span><span class="tm-kv-v">${escapeHtml(t.proj_record || '—')}${t.proj_band ? ` <span style="color:var(--text-light);font-weight:500;">± ${t.proj_band}</span>` : ''}</span></div>
            <div class="tm-kv"><span class="tm-kv-k">Expected wins</span><span class="tm-kv-v">${t.expected_wins != null ? t.expected_wins.toFixed(1) : '—'}</span></div>
            <div class="tm-kv"><span class="tm-kv-k">Rating variance</span><span class="tm-kv-v">${variance == null ? '—' : variance.toFixed(1) + ' pts'}</span></div>
            <div class="tm-kv"><span class="tm-kv-k">Strength of schedule</span><span class="tm-kv-v">${sosRank ? '#' + sosRank + ' <span style="color:var(--text-light);font-weight:500;">of ' + teams.length + '</span>' : '—'}</span></div>
            <div class="tm-kv"><span class="tm-kv-k">Danger spots</span><span class="tm-kv-v">${season.filter(g => g.danger).length}</span></div>
          </div>
        </div>
        <div>
          <div class="tm-sect-h">Who moves the needle <span class="note">updates daily</span></div>
          <div class="tm-panel" id="tmPlayers">
            <div class="tm-players-empty">Loading player data…</div>
          </div>
        </div>
      </section>
    </div>`;
  loadPlayers(t.team);
}

// ── Player leaders (display only — player data never votes) ──
function loadPlayers(team) {
  const box = document.getElementById('tmPlayers');
  const n = v => (v == null ? '—' : Number(v) % 1 === 0 ? String(v) : Number(v).toFixed(1));
  const prow = (name, pos, sub, val, lab) => `
    <div class="tm-prow">
      <span>
        <span class="tm-prow-name">${escapeHtml(name || '—')}${pos ? `<span class="pos">${escapeHtml(pos)}</span>` : ''}</span>
        <span class="tm-prow-sub">${sub}</span>
      </span>
      <span class="tm-prow-val">${val}<span class="lab">${lab}</span></span>
    </div>`;
  fetch(`${API}/teams/${encodeURIComponent(team)}/players?season=${SEASON}`)
    .then(r => { if (!r.ok) throw new Error(`players ${r.status}`); return r.json(); })
    .then(d => {
      if (!d.has_data) {
        box.innerHTML = `<div class="tm-players-empty">Player data lands with the next data pull — usage, efficiency, and season lines show here once the games are in the books.</div>`;
        return;
      }
      const groups = [];
      if (d.qb && d.qb.length) {
        groups.push(`<div class="tm-pgroup"><div class="tm-pgroup-h">Quarterback</div>` +
          d.qb.map(p => prow(p.name, null,
            `${n(p.comp)}/${n(p.att)} · ${n(p.pass_yds)} yds · ${n(p.pass_td)} TD, ${n(p.ints)} INT${p.rush_yds ? ` · ${n(p.rush_yds)} rush` : ''}`,
            n(p.ypa), 'yds/att')).join('') + `</div>`);
      }
      if (d.backs && d.backs.length) {
        groups.push(`<div class="tm-pgroup"><div class="tm-pgroup-h">On the ground</div>` +
          d.backs.map(p => prow(p.name, p.position,
            `${n(p.car)} car · ${n(p.rush_yds)} yds · ${n(p.rush_td)} TD${p.usage != null ? ` · ${(p.usage * 100).toFixed(0)}% of plays` : ''}`,
            n(p.ypc), 'yds/carry')).join('') + `</div>`);
      }
      if (d.receivers && d.receivers.length) {
        groups.push(`<div class="tm-pgroup"><div class="tm-pgroup-h">Through the air</div>` +
          d.receivers.map(p => prow(p.name, p.position,
            `${n(p.rec)} rec · ${n(p.rec_yds)} yds · ${n(p.rec_td)} TD`,
            n(p.ypr), 'yds/catch')).join('') + `</div>`);
      }
      if (d.defense && d.defense.length) {
        groups.push(`<div class="tm-pgroup"><div class="tm-pgroup-h">Defense</div>` +
          d.defense.map(p => prow(p.name, p.position,
            `${n(p.tfl)} TFL · ${n(p.sacks)} sacks${p.ints ? ` · ${n(p.ints)} INT` : ''}${p.pd ? ` · ${n(p.pd)} PD` : ''}`,
            n(p.tackles), 'tackles')).join('') + `</div>`);
      }
      box.innerHTML = groups.join('') ||
        `<div class="tm-players-empty">No player lines yet for this team.</div>`;
    })
    .catch(() => {
      box.innerHTML = `<div class="tm-players-empty">Player data is warming up — check back after the next pull.</div>`;
    });
}

if (!TEAM) {
  notFound('No team in the address.');
} else {
  Promise.all([
    fetch(`${API}/rankings/teams?season=${SEASON}&offseason=1`)
      .then(r => { if (!r.ok) throw new Error(`board ${r.status}`); return r.json(); }),
    fetch(`${API}/teams/colors`).then(r => r.json()).catch(() => null),
  ])
    .then(([p, colors]) => render(p, colors))
    .catch(() => {
      els.body.innerHTML = `<div class="tm-state"><div class="tm-state-title">The board is rebuilding.</div>
        <div class="tm-state-sub">Give it a moment and refresh — rankings recompute after every data pull.</div></div>`;
    });
}
</script>
