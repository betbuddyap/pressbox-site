<style>
  /* ── Site nav (copied from live-lines.html — keep in sync across pages) ── */
  html, body { background: var(--cream); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  nav { background: var(--cream); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: var(--max); margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .nav-logo img { height: 68px; width: auto; display: block; }
  .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .nav-links a { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-mid); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-links a.nav-live { color: var(--rust) !important; font-weight: 700; letter-spacing: 0.3px; position: relative; text-transform: uppercase; font-size: 11px; }
  .nav-links a.nav-live::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--rust); border-radius: 50%; margin-right: 7px; vertical-align: 2px; animation: pulse-live 2.4s ease-in-out infinite; }
  .nav-links a.nav-live:hover { color: var(--rust-light) !important; }
  .nav-links a.nav-live.active { color: var(--ink) !important; }
  .nav-links a.nav-live.active::before { background: var(--ink); animation: none; }
  @keyframes pulse-live { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
  .mobile-menu a.nav-live-mobile { color: var(--rust) !important; }
  .hamburger { display: none; flex-direction: column !important; align-items: center; justify-content: center; gap: 5px; cursor: pointer; padding: 4px; background: transparent; border: 0; outline: 0; -webkit-appearance: none; appearance: none; border-radius: 0; box-shadow: none; width: 32px; height: 32px; }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
  .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--cream); z-index: 300; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
  .mobile-menu.open { display: flex !important; }
  .mobile-menu a { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .mobile-menu .close-btn { position: absolute; top: 28px; right: 28px; font-size: 28px; cursor: pointer; background: none; border: none; color: var(--ink); line-height: 1; }
  @media (min-width: 961px) { .hamburger { display: none !important; } }
  @media (max-width: 960px) { .nav-links { display: none; } .hamburger { display: flex; } }

  /* ── Allocator-specific (everything else reuses live-lines.css ll- classes) ── */
  .al-intro { margin: var(--space-6) 0 var(--space-5); }
  .al-eyebrow { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--gold); margin: 0 0 var(--space-2); }
  .al-headline { font-family: var(--serif); font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--ink); margin: 0 0 var(--space-2); line-height: 1.1; }
  .al-sub { font-family: var(--sans); font-size: var(--text-base); color: var(--text-mid); margin: 0; max-width: 62ch; line-height: 1.55; }

  /* Controls panel */
  .al-controls { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-6); align-items: start; background: var(--cream-dark); border: 0.5px solid var(--border); border-radius: 12px; padding: var(--space-5); margin-bottom: var(--space-5); }
  @media (max-width: 720px) { .al-controls { grid-template-columns: 1fr; gap: var(--space-5); } }
  .al-controls-left { display: flex; flex-direction: column; }
  .al-field-label { display: block; font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid); margin: 0 0 var(--space-2); }
  .al-money-wrap { position: relative; display: flex; align-items: center; width: 100%; }
  .al-money-wrap .al-prefix { position: absolute; left: 13px; font-family: var(--sans); font-weight: var(--weight-regular); font-size: var(--text-base); color: var(--text-mid); pointer-events: none; }
  .al-input { font-family: var(--sans); font-weight: var(--weight-regular); font-size: var(--text-base); color: var(--ink); background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; width: 100%; box-sizing: border-box; transition: border-color 0.15s; }
  .al-input:focus { outline: none; border-color: var(--gold); }
  .al-input.al-money { padding-left: 26px; }
  .al-frac { display: flex; gap: var(--space-2); }
  .al-hint { font-family: var(--sans); font-size: var(--text-sm); color: var(--text-mid); margin: var(--space-2) 0 0; }
  /* Book exclusion chips. On = in the shopping pool; .off = excluded (dim +
     struck). Full-width row spanning both control columns — inside the 240px
     left column ten books wrapped into a ragged pile (Austin, 2026-08-22:
     "one row probably for desktop and some form of organized stack for
     mobile"). grid-auto-flow:column gives exactly ONE row of equal cells
     for any book count; breakpoints fold it to a tidy 5x2 then 2-across. */
  .al-books-excl { grid-column: 1 / -1; border-top: 1px solid var(--border); padding-top: var(--space-4); }
  /* Five equal columns, two tidy rows. A literal single row of ten was
     measured and clips "Hard Rock Bet" / "theScore Bet" inside the 920px
     container even before page padding — ellipsized button labels lose to
     one clean 5x2 at full type size. Phones fold to 2-across. */
  .al-books-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 560px) {
    .al-books-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .al-book-chip {
    font-family: var(--sans); font-size: var(--text-sm); font-weight: var(--weight-semi);
    letter-spacing: 0.02em; color: var(--ink); background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 7px 6px; cursor: pointer; line-height: 1.3;
    text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .al-book-chip:hover { border-color: var(--gold); }
  .al-book-chip.off {
    color: var(--text-light); text-decoration: line-through;
    background: var(--cream-dark);
  }

  /* Summary bar */
  .al-summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-6); padding: var(--space-4) 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: var(--space-4); }
  .al-summary-stat { display: flex; flex-direction: column; gap: 2px; }
  .al-summary-k { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid); }
  .al-summary-v { font-family: var(--serif); font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--ink); line-height: 1.1; }
  .al-summary-v.al-hero { color: var(--gold); }
  .al-warn { background: color-mix(in srgb, var(--rust) 14%, transparent); border: 1px solid color-mix(in srgb, var(--rust) 35%, transparent); color: var(--rust); font-family: var(--sans); font-size: var(--text-sm); line-height: 1.5; padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: var(--space-4); }

  /* Book allocator — how much to have at each sportsbook */
  .al-books { background: var(--cream-dark); border: 0.5px solid var(--border); border-radius: 12px; padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5); }
  .al-books-title { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid); margin-bottom: var(--space-2); }
  .al-books-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 0.5px solid var(--cream-mid); }
  .al-books-row:last-child { border-bottom: none; }
  .al-books-name { font-family: var(--sans); font-size: var(--text-base); font-weight: var(--weight-semi); color: var(--ink); text-decoration: none; }
  a.al-books-name:hover { color: var(--gold); text-decoration: underline; }
  .al-books-amt { font-family: var(--sans); font-size: var(--text-base); font-weight: var(--weight-semi); color: var(--ink); }

  /* Bet rows reuse .ll-row; metrics + stake sit inline, vertically centered */
  .al-card { overflow: hidden; }
  .al-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); width: 100%; background: transparent; border: none; text-align: left; font-family: inherit; cursor: pointer; }
  .al-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .ll-accordion .ll-bet-button { margin-top: var(--space-3); }
  .al-metrics { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-5); }
  .al-metric { display: flex; flex-direction: column; gap: 1px; }
  .al-metric-k { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid); line-height: 1.3; white-space: nowrap; }
  .al-metric-v { font-family: var(--sans); font-weight: var(--weight-semi); font-size: var(--text-sm); color: var(--ink); line-height: 1.3; }
  .al-metric-v.al-pos { color: var(--sage); }
  .al-metric-v.al-neg { color: var(--rust); }
  /* My Bets handoff button under the summary */
  .al-mybets { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 14px 0 4px; }
  .al-mybets-btn { font-family: var(--sans); font-size: 13px; font-weight: var(--weight-semi); color: var(--cream); background: var(--ink); border: 0; border-radius: 4px; padding: 11px 20px; cursor: pointer; }
  .al-mybets-hint { font-family: var(--sans); font-size: 11px; color: var(--text-mid); }

  .al-stake { flex: 0 0 auto; text-align: right; }
  .al-stake-amt { font-family: var(--sans); font-size: var(--text-lg); font-weight: var(--weight-semi); color: var(--ink); line-height: 1.15; }
  .al-stake-lbl { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: var(--weight-semi); text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-mid); margin-top: 2px; white-space: nowrap; }
  .al-bet { display: block; }
  @media (max-width: 640px) {
    .al-head { flex-wrap: wrap; gap: var(--space-3); }
    /* flex-basis 0, not auto: with wrap on, the line breaks on base sizes
       before anything shrinks, so a long matchup would shove the stake and
       chevron onto a line of their own. Zero basis keeps the head at two
       rows and lets the matchup wrap inside its own column instead. */
    .al-head > .ll-row-content { order: 1; flex: 1 1 0; }
    .al-head > .al-stake { order: 2; margin-left: auto; }
    .al-head > .ll-row-chevron { order: 3; }
    .al-head > .al-metrics { order: 4; flex: 1 0 100%; margin-top: var(--space-1); gap: var(--space-6); }
  }

  /* Include-parlays toggle */
  .al-toggle { display: inline-flex; align-items: center; gap: var(--space-2); margin-top: var(--space-4); background: none; border: none; padding: 0; cursor: pointer; font-family: var(--sans); font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--text-mid); }
  .al-toggle-box { width: 34px; height: 20px; border-radius: 999px; background: var(--cream-mid); border: 1px solid var(--border); position: relative; transition: background 0.15s, border-color 0.15s; flex: 0 0 auto; }
  .al-toggle-box::after { content: ''; position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.15s; }
  .al-toggle.active { color: var(--ink); }
  .al-toggle.active .al-toggle-box { background: var(--gold); border-color: var(--gold); }
  .al-toggle.active .al-toggle-box::after { transform: translateX(14px); }
  .al-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Parlay cards */
  .al-badge-parlay { background: var(--gold); color: var(--ink); }
  .al-card-parlay { border-left: 3px solid var(--gold); }
  .al-pl-leg { padding: var(--space-2) 0; border-bottom: 0.5px solid var(--cream-mid); }
  .al-pl-leg:last-of-type { border-bottom: none; }
  .al-pl-leg-match { font-family: var(--sans); font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--ink); }
  .al-pl-leg-pick { font-family: var(--sans); font-size: var(--text-sm); color: var(--text-mid); margin-top: 1px; }
  .al-empty { padding: var(--space-6) 0; font-family: var(--sans); font-size: var(--text-base); color: var(--text-mid); }
  /* Single-book mode: a ticket the chosen book can't build says WHY instead
     of silently vanishing. */
  .al-dropped-note { margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); border-radius: var(--radius-md); font-family: var(--sans); font-size: var(--text-sm); color: var(--text-mid); }
  .al-dropped-note b { color: var(--ink); font-weight: var(--weight-semi); }
  .al-page-pad { height: 48px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  // ── Config (identical base to live-lines / parlay) ───────────
  const API_BASE  = 'https://betbuddy-backend.onrender.com';
  const BOARD_URL = `${API_BASE}/parlay/board`;
  const PRESETS_URL = `${API_BASE}/parlay/presets`;
  const SEASON    = 2026;

  const SUPABASE_URL  = 'https://brwalcuodwxsynrpiqjc.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyd2FsY3VvZHd4c3lucnBpcWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NzMyNzQsImV4cCI6MjA5MjA0OTI3NH0.HjHkM1Ir9LGutCfAEQsOWOjQ6I5-otzGoReLvrPs6iQ';
  const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

  // Objective presets — the tilt (β) decides WHAT gets the biggest slices.
  // weight = win_prob * decimal_odds^beta
  //   beta 0   -> weight = win prob            (favor most likely)
  //   beta 0.5 -> weight = win_prob * sqrt(odds)
  //   beta 1   -> weight = win_prob * odds     (favor expected payout)
  const PRESETS = [
    { key: 'conservative', label: 'Conservative', beta: 0.0,
      blurb: 'Weights toward the highest win probability.' },
    { key: 'moderate',     label: 'Moderate',     beta: 0.5,
      blurb: 'Balances win probability and payout.' },
    { key: 'aggressive',   label: 'Aggressive',   beta: 1.0,
      blurb: 'Weights toward the highest expected payout.' },
  ];

  const state = {
    legs: [], parlays: [], weeks: [], week: null,
    amount: 1000,          // total the user wants to bet, split 100%
    presetKey: 'moderate',
    includeParlays: true,  // roll a parlay or two into the mix
    // Single-book mode (user feedback: plenty of people only use one book).
    // null = shop every book for the best line, the original behavior.
    // A name = every bet re-priced at THAT book's line and juice; picks the
    // book doesn't post drop off the sheet. Persisted across visits.
    book: (() => { try { return localStorage.getItem('al_book') || null; } catch (e) { return null; } })(),
    // Books the user CAN'T bet (restricted state, no account). Excluded books
    // drop out of the shopping pool and every stake re-shops across the rest.
    // Persisted — a restriction doesn't change week to week. (Austin,
    // 2026-08-22: couldn't sign up for Bovada in a restricted state.)
    excluded: (() => {
      try { return new Set(JSON.parse(localStorage.getItem('al_excluded_books') || '[]')); }
      catch (e) { return new Set(); }
    })(),
    // Same filter model as Live Lines / Parlay: market and tier are each
    // single-select and mutually exclusive; null/null = all picks.
    filters: { market: null, tier: null },
    // Board view (Austin, 9/6): 'current' = the live regraded board;
    // 'released' = every pick AS RELEASED — the grade/line/price/book of
    // record — because staggered releases mean the full release board
    // never exists on the site as one simultaneous snapshot. On the
    // released view a FAVORABLE move never touches the grade (Over 50
    // released, market now 47 = an even better entry, even outside the
    // cell); the optional drop hides only picks the market moved AGAINST
    // hard enough that the grade no longer holds (adverse direction AND
    // currently No Edge).
    boardView: (() => { try { return localStorage.getItem('al_view') === 'released' ? 'released' : 'current'; } catch (e) { return 'current'; } })(),
    dropInvalidated: (() => { try { return localStorage.getItem('al_drop_inv') === '1'; } catch (e) { return false; } })(),
    loading: true, error: false,
  };

  const root = document.getElementById('al-root');

  // ── Utilities (mirrored from live-lines / parlay) ────────────
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function weekLabel(w) { return w === 0 ? 'Week 0' : `Week ${w}`; }
  function fmtSigned(n) { return (Number(n) > 0 ? '+' : '') + n; }
  function fmtMoney(n) {
    const v = Math.round(Number(n) || 0);
    return v.toLocaleString('en-US');
  }
  function currentPreset() {
    return PRESETS.find(p => p.key === state.presetKey) || PRESETS[1];
  }

  function renderBadge(tier, bolt) {
    const map = {
      'A+':          { label: 'A+', aria: 'A+ tier — corroborated top pick', key: 'aplus' },
      'A':           { label: 'A',  aria: 'A tier — gold',    key: 'A' },
      'B':           { label: 'B',  aria: 'B tier — silver',  key: 'B' },
      'C':           { label: 'C',  aria: 'C tier — bronze',  key: 'C' },
      'smart_money': { label: 'SM', aria: 'Smart Money tier', key: 'smart_money' },
      'goldilocks':  { label: 'GL', aria: 'Goldilocks tier',  key: 'goldilocks' },
      'lottery':     { label: 'LT', aria: 'Lottery tier',     key: 'lottery' },
      'ml_pickem':   { label: 'ML', aria: 'A+ moneyline expression', key: 'aplus' },
      'no_edge':     { label: 'NE', aria: 'No edge',          key: 'no_edge' },
    };
    const m = map[tier] || { label: esc(tier), aria: esc(tier), key: 'no_edge' };
    const boltKey = ({ aplus: 'aplus', A: 'A', B: 'B', C: 'C' })[m.key];
    const boltHtml = (bolt && boltKey)
      ? `<span class="ll-bolt ll-bolt--${boltKey}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 1 5.5 14.5h6L9.5 23l9.5-13.5h-6z"/></svg></span>`
      : '';
    const aria = bolt ? `${m.aria} — streak-aligned` : m.aria;
    return `<span class="ll-badge ll-badge--${m.key}" aria-label="${aria}">${m.label}${boltHtml}</span>`;
  }

  function pickText(leg) {
    const bookName = leg.book && leg.book.name ? ` \u00b7 ${esc(leg.book.name)}` : '';
    if (leg.market === 'ml') return `${esc(leg.side)} ML <span class="ll-row-pick-num">${esc(leg.line)}</span>${bookName}`;
    return `${esc(leg.side)} <span class="ll-row-pick-num">${esc(leg.line)}</span>${bookName}`;
  }

  // Mirror live-lines.js renderLineMove. Arrow = the market's move, colour =
  // what it means for you. Rust when the market came TOWARD our pick: the
  // number we published is gone, so you'd be buying worse than we graded.
  // Sage when it drifted away. (My Bets swaps them \u2014 the bet is already down.)
  //
  // Only on straight legs. A parlay card is several legs at once and one
  // arrow cannot speak for all of them; the per-leg rows inside carry it.
  const MOVE_GLYPH = { up: '\u2191', down: '\u2193', left: '\u2190', right: '\u2192' };

  function renderLineMove(mv) {
    if (!mv || !mv.direction) return '';
    const toward = mv.direction === 'toward';
    return `<div class="ll-row-move ll-row-move--${toward ? 'toward' : 'away'}">` +
           `<span class="ll-row-move-arrow" aria-hidden="true">${MOVE_GLYPH[mv.arrow] || ''}</span>` +
           `${esc(mv.text)} <span class="ll-row-move-nums">` +
           `${esc(mv.released_line)} &rarr; ${esc(mv.current_line)}</span></div>`;
  }

  // ── Auth (mirrored from parlay — localStorage fast-path, 4s cap) ──
  async function getAccessToken() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
          const v = JSON.parse(localStorage.getItem(k) || 'null');
          const tok = v && (v.access_token
                        || (v.currentSession && v.currentSession.access_token)
                        || (Array.isArray(v) && v[0]));
          if (tok) return tok;
        }
      }
    } catch (e) {}
    if (!sb) return null;
    try {
      const timeout = new Promise((res) => setTimeout(() => res(null), 4000));
      const live = sb.auth.getSession().then(
        (r) => (r && r.data && r.data.session && r.data.session.access_token) || null);
      return await Promise.race([live, timeout]);
    } catch (e) { return null; }
  }

  // ── Network ──────────────────────────────────────────────────
  async function fetchBoard() {
    state.loading = true; state.error = false; render();
    try {
      const headers = {};
      const token = await getAccessToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(`${BOARD_URL}?season=${SEASON}`, { credentials: 'omit', headers });
      if (res.status === 401 || res.status === 402) { state.loading = false; renderPaywall(); return; }
      if (!res.ok) throw new Error(`board HTTP ${res.status}`);
      const payload = await res.json();
      // Keep a leg when EITHER view can price it — a released-graded pick
      // that regraded to No Edge may have no current pricing but is exactly
      // what the released view exists to show.
      const legs = (payload.legs || []).filter(l => l && (
        (l.our_prob != null && l.decimal_odds != null)
        || (l.released && l.released.our_prob != null && l.released.decimal_odds != null)));
      state.legs = legs;
      // Derive the week bar from the legs themselves (board returns the whole pool).
      const weeks = [...new Set(legs.map(l => l.week).filter(w => w != null))].sort((a, b) => a - b);
      state.weeks = weeks;
      if (state.week == null) state.week = (payload.week != null && weeks.includes(payload.week)) ? payload.week : (weeks[0] ?? null);
      // Show the straights immediately — don't make the page wait on parlays.
      state.loading = false;
      render();
      // Parlays load in the background and fill in when ready.
      fetchParlays().then(render).catch(() => {});
      // The released-parlay gate counts the SAME things Upcoming shows
      // (Austin counted 20 of 47 there while the legs-derived gate said
      // 15 of 84): denominator = the week's still-unplayed FBS matchups
      // from /games/upcoming; numerator = those with ANY released row
      // (No Edge verdicts included — a release is a release) per
      // /picks/upcoming. Both land async; the gate falls back to an
      // absolute floor until they do.
      fetch(`${API_BASE}/games/upcoming?season=${SEASON}`, { credentials: 'omit', headers })
        .then(r => (r.ok ? r.json() : null))
        .then(j => {
          if (!j || !j.games) return;
          state.schedGames = j.games
            .filter(g => g.is_fbs_matchup && g.status === 'scheduled')
            .map(g => ({ week: g.week, id: String(g.game_id) }));
          render();
        })
        .catch(() => {});
      fetch(`${API_BASE}/picks/upcoming?season=${SEASON}`, { credentials: 'omit', headers })
        .then(r => (r.ok ? r.json() : null))
        .then(j => {
          if (!j || !j.picks) return;
          state.releasedGameIds = new Set(Object.keys(j.picks).map(String));
          render();
        })
        .catch(() => {});
    } catch (e) {
      state.loading = false; state.error = true; render();
    }
  }

  // Roll a parlay or two into the pool. Primary source is ONE /parlay/presets
  // call (it builds the leg pool once and returns the whole gallery), so this is
  // a single round-trip, not one build per ticket. Combined win prob + combined
  // odds feed the same weight = p * odds^beta the straight bets use.

  // Signature of a ticket = its sorted leg ids, for de-duping tickets that
  // resolve to the same legs on a thin slate.
  function _legSig(legs) {
    return (legs || []).map(l => l.leg_id).sort().join('|');
  }

  function _normTicket(src, week, opts) {
    const c = src.combined || {};
    const bb = src.best_book || null;
    return {
      is_parlay:      true,
      parlay_id:      opts.id,
      name:           opts.name || 'Parlay',
      ptype:          opts.ptype,
      subtitle:       opts.subtitle || '',
      leg_count:      src.leg_count,
      week:           week,
      our_prob:       c.our_prob,
      fair_prob:      (c.market_fair_prob != null ? c.market_fair_prob : null),
      decimal_odds:   c.decimal_odds,
      price_american: c.american_odds,
      edge:           (c.edge_vs_market != null ? c.edge_vs_market : null),
      legs:           Array.isArray(src.legs) ? src.legs : [],
      book:           bb ? { name: bb.book, url: bb.url } : null,
      // Per-book full-ticket odds (books that post every leg). Single-book
      // mode prices the ticket from here — or drops it if the book is absent.
      book_breakdown: Array.isArray(src.book_breakdown) ? src.book_breakdown : [],
    };
  }

  async function fetchParlays() {
    if (!state.includeParlays) { state.parlays = []; return; }
    try {
      const headers = {};
      const token = await getAccessToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const wq = state.week != null ? `&week=${state.week}` : '';
      const valid = x => x && x.our_prob != null && x.decimal_odds != null
                           && (x.legs || []).length >= 2;

      const items = [], seen = new Set();

      // Primary: one presets call → pick two DISTINCT tickets (different
      // character when possible, always different leg sets).
      try {
        const res = await fetch(`${PRESETS_URL}?season=${SEASON}${wq}`, { credentials: 'omit', headers });
        if (res.ok) {
          const payload = await res.json();
          const wk = payload.week != null ? payload.week : state.week;
          const pref = ['best_3','longshot_3','safest_3','best_4','longshot_4','safest_4',
                        'best_5','longshot_5','safest_5'];
          const rank = id => { const i = pref.indexOf(id); return i === -1 ? 99 : i; };
          const gallery = (payload.presets || []).slice().sort((a, b) => rank(a.id) - rank(b.id));
          const types = new Set();
          for (const pre of gallery) {                 // distinct type + legs
            const it = _normTicket(pre, wk, { id: pre.id, name: pre.name, ptype: pre.type, subtitle: pre.subtitle });
            const sig = _legSig(it.legs);
            if (!valid(it) || seen.has(sig) || types.has(it.ptype)) continue;
            seen.add(sig); types.add(it.ptype); items.push(it);
            if (items.length >= 2) break;
          }
          if (items.length < 2) for (const pre of gallery) {   // fill any new leg set
            const it = _normTicket(pre, wk, { id: pre.id, name: pre.name, ptype: pre.type, subtitle: pre.subtitle });
            const sig = _legSig(it.legs);
            if (!valid(it) || seen.has(sig)) continue;
            seen.add(sig); items.push(it);
            if (items.length >= 2) break;
          }
        }
      } catch (_) { /* fall through to fallback */ }

      // Fallback (thin week only): one 2-leg prebuilt so the week still gets a
      // swing when presets couldn't assemble a full ticket.
      if (items.length < 2) {
        try {
          const r2 = await fetch(`${API_BASE}/parlay/prebuilt?season=${SEASON}&legs=2&bet_type=all&goal=max_return${wq}`,
                                 { credentials: 'omit', headers });
          if (r2.ok) {
            const pb = await r2.json();
            if (pb && Array.isArray(pb.legs)) {
              const it = _normTicket(pb, pb.week != null ? pb.week : state.week,
                                     { id: 'pb_max_return', name: 'Longshot', ptype: 'max_return' });
              const sig = _legSig(it.legs);
              if (valid(it) && !seen.has(sig)) { seen.add(sig); items.push(it); }
            }
          }
        } catch (_) { /* ignore */ }
      }

      state.parlays = items.slice(0, 2);
    } catch (e) {
      state.parlays = [];
    }
  }

  // ── Kelly sizing ─────────────────────────────────────────────
  function matchesFilters(leg) {
    if (state.week != null && leg.week !== state.week) return false;
    const f = state.filters;
    if (f.tier && leg.tier !== f.tier) return false;
    if (f.market && leg.market !== f.market) return false;
    return true;
  }

  // ── Released view ─────────────────────────────────────────────
  // Movement since release, RELEASED-side POV. "Adverse" is the validity
  // direction: the number got worse for our released side (fewer points /
  // laying more; Under's total dropping / Over's rising; an ML price
  // lengthening = the market running away from our side).
  function relMove(raw) {
    const r = raw.released || {};
    const sameSide = (r.side_raw != null && raw.side_raw != null)
      ? String(r.side_raw) === String(raw.side_raw) : true;
    const amDec = (x) => (x > 0 ? 1 + x / 100 : 1 + 100 / (-x));
    if (raw.market === 'ml') {
      if (!sameSide) {
        return { txt: 'the market flipped the favorite', adverse: true, moved: true, bare: true };
      }
      const a = Number(r.price_american), b = Number(raw.price_american);
      if (!isFinite(a) || !isFinite(b)) return null;
      if (a === b) return { moved: false };
      return { txt: `${fmtSigned(a)} → ${fmtSigned(b)}`,
               adverse: amDec(b) > amDec(a), moved: true };
    }
    let cur = Number(raw.line_raw);
    const rel = Number(r.line_raw);
    if (!isFinite(cur) || !isFinite(rel)) return null;
    if (!sameSide && raw.market === 'spread') cur = -cur;
    if (cur === rel) return { moved: false };
    let adverse;
    if (raw.market === 'total') {
      const under = String(r.side_raw || '').toLowerCase() === 'under';
      adverse = under ? cur < rel : cur > rel;   // Over 50 → 47 = favorable
    } else {
      adverse = cur < rel;                        // picked-side spread: lower = worse
    }
    return { txt: `${fmtSigned(rel)} → ${fmtSigned(cur)}`, adverse, moved: true };
  }
  // The drop rule: adverse movement AND the grade no longer holds at
  // today's number (current No Edge). A favorable move never drops a
  // pick — the released grade stands, now at a better entry.
  function invalidatedAdversely(raw) {
    if ((raw.tier || 'no_edge') !== 'no_edge') return false;
    const mv = relMove(raw);
    return !!(mv && mv.moved && mv.adverse);
  }
  // The RELEASED pick, BETTABLE TODAY (Austin, 9/7: "show the released
  // picks at the current line and juice. then show the release to current
  // numbers... but with the original grade"): the row's side, grade, and
  // sizing probability are the RELEASE of record; its line, juice, book,
  // and book table are the CURRENT market for that side, shopped through
  // the exact same machinery as the current view (best line then price,
  // single-book, exclusions). The chip narrates released → current. Only
  // when the board flipped sides (no current data for our released side)
  // does the released record stand in as the display.
  function releasedView(raw) {
    const r = raw.released;
    if (!r || !r.tier || r.tier === 'no_edge') return null;
    if (!(r.our_prob > 0)) return null;
    if (state.dropInvalidated && invalidatedAdversely(raw)) return null;
    let cur = null;
    const sameSide = String(raw.side_raw) === String(r.side_raw);
    if (sameSide) {
      // the leg's book table describes our side — shop it directly (pass
      // released prob/dec through for legs whose current pricing the
      // server suppressed).
      cur = bookView((raw.our_prob != null && raw.decimal_odds != null)
        ? raw : { ...raw, our_prob: r.our_prob, decimal_odds: r.decimal_odds });
    } else if (r.other_books && r.other_books.length) {
      // Board flipped sides — the backend ships the RELEASED side's own
      // book table; shop it like any other leg so the row is a real,
      // bettable current quote (Clemson released −23.5 was masquerading
      // as a live BetMGM quote at a number the book stopped selling).
      cur = bookView({ ...raw,
        side: r.side, side_raw: r.side_raw,
        line: r.line, line_raw: r.line_raw,
        price_american: r.price_american, decimal_odds: r.decimal_odds,
        our_prob: r.our_prob,
        other_books: r.other_books, book: r.book, line_move: null });
    }
    if (!cur) {
      if (state.book) return null;   // chosen book can't bet it — same as current view
      cur = { ...raw, side: r.side, side_raw: r.side_raw,
              line: r.line, line_raw: r.line_raw,
              price_american: r.price_american, decimal_odds: r.decimal_odds,
              book: r.book, other_books: [] };
    }
    if (!(cur.decimal_odds > 1)) return null;
    const mv = raw.market === 'ml'
      ? mlPayMove(r.price_american, cur.price_american)
      : relMove({ market: raw.market, side_raw: r.side_raw,
                  line_raw: cur.line_raw, released: r });
    return { ...cur, tier: r.tier, bolt: false,
             our_prob: r.our_prob, edge: null,
             line_move: null, _relMove: mv };
  }
  function renderRelMove(mv) {
    if (!mv || !mv.moved) return '';
    const cls = mv.adverse ? 'away' : 'toward';
    const label = mv.bare ? '' : (mv.label
      || (mv.adverse ? 'moved against the release · ' : 'better than the release · '));
    return `<div class="ll-row-move ll-row-move--${cls}">${label}` +
           `<span class="ll-row-move-nums">${esc(mv.txt)}</span></div>`;
  }

  // ML chips compare the released price to THE PRICE ON THE ROW (what you
  // can actually bet) and speak payout language — the market-direction
  // read confused three numbers onto one row (Missouri −225 · −238 → −245,
  // Austin 9/7). Display only: the invalidation predicate stays the
  // market-direction relMove.
  function mlPayMove(relAm, nowAm) {
    const a = Number(relAm), b = Number(nowAm);
    if (!isFinite(a) || !isFinite(b)) return null;
    if (a === b) return { moved: false };
    const dec = (x) => (x > 0 ? 1 + x / 100 : 1 + 100 / (-x));
    const better = dec(b) > dec(a);
    return { txt: `${fmtSigned(a)} → ${fmtSigned(b)}`, moved: true,
             adverse: !better,
             label: better ? 'pays better than the release · '
                           : 'pays worse than the release · ' };
  }

  // Released-view tickets: the SAME Best/Longshot construction the sheet's
  // parlays use (rank p·dec / p·dec², one leg per game, three legs),
  // built from the released legs at released prices.
  function releasedParlays(legs) {
    const pick3 = (ranked) => {
      const out = [], used = new Set();
      for (const l of ranked) {
        if (used.has(l.game_id)) continue;
        used.add(l.game_id);
        out.push(l);
        if (out.length === 3) break;
      }
      return out;
    };
    const decAm = (dec) => (dec >= 2
      ? Math.round((dec - 1) * 100) : -Math.round(100 / (dec - 1)));
    const mk = (name, ls) => {
      if (ls.length < 3) return null;
      let p = 1, dec = 1;
      for (const l of ls) { p *= l.our_prob; dec *= l.decimal_odds; }
      return { name, legs: ls, our_prob: p, decimal_odds: dec,
               price_american: decAm(dec), leg_count: ls.length,
               week: ls[0].week, book: null, edge: null };
    };
    const best = mk('Best 3-leg',
      pick3(legs.slice().sort((a, b) => b.our_prob * b.decimal_odds - a.our_prob * a.decimal_odds)));
    const lon = mk('Longshot 3-leg',
      pick3(legs.slice().sort((a, b) => b.our_prob * b.decimal_odds ** 2 - a.our_prob * a.decimal_odds ** 2)));
    const out = [], seen = new Set();
    for (const t of [best, lon]) {
      if (!t) continue;
      const sig = t.legs.map(l => `${l.game_id}|${l.market}`).sort().join(',');
      if (seen.has(sig)) continue;
      seen.add(sig);
      out.push(t);
    }
    return out;
  }

  // ── Delta sizing, compressed (Austin's spec, 2026-08-19b) ───────────
  //   weight = ((p − the % to clear) × p) ^ SIZING_GAMMA
  //
  // p is the pick's GRADED probability (our_prob): the tier anchor moved by
  // the shrunk deviation of the WHOLE BLOC that fired — the aggregate of
  // every supporting signal, not one cell's record. The % to clear is the
  // PRICE's implied probability (1/decimal, vig included: −110 clears 52.4%,
  // +400 clears 20%). Bets at or below their price's implied get $0 and drop
  // off the sheet. The `× p` second factor risk-weights the same edge by how
  // often the bet actually cashes.
  //
  // NOT the raw bloc hit rate (the rule this replaced): an unshrunk record
  // doesn't respect the grade ladder. On this board a B spread reads 65.2%
  // (n=69) against an A+ total's 58.8% (n=220), so sizing on it staked a B
  // ABOVE an A+ and the sheet contradicted the board's own grades. The graded
  // number is anchor-led, so A+ > A > B > C holds by construction.
  //
  // SIZING_GAMMA compresses the spread. Raw delta×p ran 95:1 top-to-bottom on
  // a 61-leg board (tail legs priced in pennies). Lower gamma = flatter
  // sheet; 1.0 restores the uncompressed rule.
  //
  // 0.65 -> 0.50 (Austin, 2026-08-20). 0.65 was tuned BEFORE the tier anchors
  // were re-derived for the 253-rule electorate; raising A to .661 and B to
  // .616 re-widened the sheet to 5.0:1 with a single leg taking $72 of every
  // $1,000. At 0.50 that is 3.5:1 and $63, and an A still draws 2.1x a C —
  // the ladder stays visible, which stops being true much below 0.40.
  // Measured on the 2026-08-20 board (28 legs): A $62.53 · B $45.30 ·
  // C $29.50 · ML $30.97 per leg.
  const SIZING_GAMMA = 0.50;
  function sizingProb(leg) {
    return leg ? leg.our_prob : null;
  }
  function deltaWeight(p, dec) {
    if (!(p > 0) || !(dec > 1)) return 0;
    const edge = p - 1 / dec;
    if (!(edge > 0)) return 0;
    return Math.pow(edge * p, SIZING_GAMMA);
  }

  // ── Single-book mode ────────────────────────────────────────────────
  function amToDec(a) {
    const o = Number(a);
    if (!o || !isFinite(o)) return null;
    return o > 0 ? 1 + o / 100 : 1 + 100 / (-o);
  }
  function allBookNames() {
    const names = new Set();
    for (const l of state.legs)
      for (const b of (l.other_books || []))
        if (b.book && b.book.name) names.add(b.book.name);
    for (const pl of state.parlays)
      for (const b of (pl.book_breakdown || []))
        if (b.book) names.add(b.book);
    return [...names].sort();
  }
  // The leg as YOUR book posts it — its line, its juice, its link. null =
  // the book doesn't post this pick, so it can't be bet there and drops off
  // the sheet. Our win probability is deliberately unchanged: it prices the
  // PICK; the book only changes what you're paid for it (same convention as
  // the other-books rows everywhere else on the site).
  function legAtBook(leg, bookName) {
    const e = (leg.other_books || []).find(b => b.book && b.book.name === bookName);
    if (!e) return null;
    const px = (e.price != null) ? e.price
             : (leg.market === 'ml' ? e.line_raw : -110);
    const dec = amToDec(px);
    if (!(dec > 1)) return null;
    return { ...leg,
      line: e.line, line_raw: e.line_raw,
      price_american: (leg.market === 'ml' ? e.line_raw : px),
      decimal_odds: dec,
      book: { name: bookName, url: (e.book && e.book.url) || null,
              note: (e.book && e.book.note) || null },
      // The journal marker describes the JOURNAL book's line. Beside a
      // re-priced line it would render a pair that never existed
      // ("moved to -300" next to a -298 row) — so it doesn't travel.
      line_move: null,
      other_books: [] };
  }
  // Best remaining book for a leg once exclusions apply. Ranks the allowed
  // entries itself rather than trusting payload order: spread and under want
  // the most points / highest number, over wants the lowest, moneyline wants
  // the best payout; ties break on price. Returns null when no allowed book
  // posts the pick — the leg drops from the sheet, same as single-book mode.
  // The settled tiebreak when line AND price match, by display name —
  // mirrors backend helpers/constants.BOOK_TIEBREAK (keep in sync when the
  // roster changes): regulated by recognizability, offshore last, so the
  // client re-shop lands on the same book the journal would credit.
  const BOOK_TIEBREAK = ['DraftKings', 'FanDuel', 'BetMGM', 'Caesars',
                         'Fanatics', 'Hard Rock Bet', 'BetRivers',
                         'theScore Bet', 'Bally Bet', 'Bovada'];
  const bookRank = (n) => {
    const i = BOOK_TIEBREAK.indexOf(n);
    return i < 0 ? 99 : i;
  };
  function bestAllowedLeg(leg) {
    const entries = (leg.other_books || []).filter(b =>
      b.book && b.book.name && !state.excluded.has(b.book.name));
    if (!entries.length) return null;
    const px = (e) => (e.price != null) ? e.price
                    : (leg.market === 'ml' ? e.line_raw : -110);
    const better = (a, b) => {
      if (leg.market === 'ml') {
        const d = (amToDec(a.line_raw) || 0) - (amToDec(b.line_raw) || 0);
        if (d) return d > 0;
      } else {
        const overWantsLow = leg.market === 'total'
          && String(leg.side_raw || leg.side || '').toLowerCase().startsWith('over');
        const d = (a.line_raw || 0) - (b.line_raw || 0);
        if (d) return overWantsLow ? d < 0 : d > 0;
      }
      const dp = (amToDec(px(a)) || 0) - (amToDec(px(b)) || 0);
      if (dp) return dp > 0;
      return bookRank(a.book.name) < bookRank(b.book.name);
    };
    let best = entries[0];
    for (const e of entries.slice(1)) if (better(e, best)) best = e;
    if (leg.book && leg.book.name === best.book.name) return leg;
    const reshopped = legAtBook(leg, best.book.name);
    if (!reshopped) return null;
    // Rebuild the dropdown from the REMAINING allowed books. The payload's
    // is_best/delta point at the original best — which may be the excluded
    // book — so both are recomputed against the new best before display.
    const overWantsLow = leg.market === 'total'
      && String(leg.side_raw || leg.side || '').toLowerCase().startsWith('over');
    const q = (e) => {
      const d = (e.line_raw || 0) - (best.line_raw || 0);
      if (leg.market === 'ml') return d;
      return overWantsLow ? -d : d;
    };
    const fmtDelta = (v) => {
      const r = Math.round(v * 10) / 10;
      return r === 0 ? 'match' : (r > 0 ? `+${r}` : `${r}`);
    };
    reshopped.other_books = entries
      .map(e => ({ ...e, is_best: q(e) === 0, delta: fmtDelta(q(e)) }))
      .sort((a, c) => (q(c) - q(a))
        || ((amToDec(px(c)) || 0) - (amToDec(px(a)) || 0))
        || (bookRank(a.book.name) - bookRank(c.book.name)));
    return reshopped;
  }
  function bookView(leg) {
    if (state.book) return legAtBook(leg, state.book);
    // ALWAYS shop (Austin, 9/7: released best price and current best
    // price, nothing else). The payload's headline quote is the regrade's
    // credited book, which can trail the live best between cycles — the
    // label says best line, so the row shops it. Legs with no book list
    // keep the endpoint quote rather than dropping.
    return bestAllowedLeg(leg) || leg;
  }
  function parlayView(pl) {
    if (state.book) {
      const e = (pl.book_breakdown || []).find(b => b.book === state.book);
      if (!e || !(e.decimal_odds > 1)) return null;
      return { ...pl, decimal_odds: e.decimal_odds, price_american: e.american_odds,
               book: { name: state.book, url: e.url || null } };
    }
    if (state.excluded.size) {
      // Best remaining ticket price among allowed books; no allowed book
      // posting every leg -> the parlay drops, same rule as a single leg.
      const ok = (pl.book_breakdown || []).filter(b =>
        b.book && !state.excluded.has(b.book) && b.decimal_odds > 1);
      if (!ok.length) return null;
      const e = ok.reduce((a, b) => (b.decimal_odds > a.decimal_odds ? b : a));
      if (pl.book && pl.book.name === e.book) return pl;
      return { ...pl, decimal_odds: e.decimal_odds, price_american: e.american_odds,
               book: { name: e.book, url: e.url || null } };
    }
    return pl;
  }

  function computeRows() {
    const amount = Number(state.amount) || 0;
    const beta = currentPreset().beta;

    // weight = ((p − % to clear) × p)^gamma × payout^beta (the preset tilt:
    // Conservative β=0 is the pure compressed delta sizing; Aggressive leans
    // toward the bigger payouts among the +edge set).
    const cand = [];
    const released = state.boardView === 'released';
    const relLegs = [];   // the released legs that made the sheet — ticket pool
    for (const raw of state.legs) {
      // Released view reshapes FIRST so the tier pills filter on the
      // RELEASED grade; a selected book re-prices the payout at its
      // current line while the released grade/probability stand.
      const leg = released ? releasedView(raw) : (matchesFilters(raw) ? bookView(raw) : null);
      if (!leg) continue;
      if (released && !matchesFilters(leg)) continue;
      if (released) relLegs.push(leg);
      const p = sizingProb(leg), dec = leg.decimal_odds;
      if (!(p > 0) || !(dec > 1)) continue;
      const f = deltaWeight(p, dec);
      if (!(f > 0)) continue;             // at/below the price's implied → no stake
      cand.push({ item: leg, is_parlay: false, p, dec,
                  weight: f * Math.pow(dec, beta),
                  edge: (leg.edge != null ? leg.edge : null), ev: (p * dec - 1) });
    }

    // Parlays: single-slate, and they span markets/tiers — so only in the mix
    // when no filter is narrowing the board (i.e. "All"). Same edge term, then
    // MULTIPLIED BY THE TICKET'S OWN HIT PROBABILITY.
    //
    // A probability-point edge doesn't mean the same thing at −110 as it does
    // at +1275: straights sit near even money so their edges compare fairly,
    // and a parlay wins that comparison twice over — no penalty for how rarely
    // it cashes, then a much bigger payout^beta tilt.
    //
    // This penalty is applied OUTSIDE deltaWeight even though deltaWeight
    // already carries a `× p`, because SIZING_GAMMA is concave: it lifts small
    // weights more than large ones, so the compression that tames the straight
    // spread also hands the penalty back to the tickets it was charging. With
    // the compression alone a parlay took the #1 slot on Moderate AND
    // Aggressive in BOTH weeks (Wk0 18.1%, Wk1 9.0%). Charging cash-frequency
    // after the compression puts a straight back on top of every preset and
    // parlays at 1.0–7.3% of the pot.
    //
    // Sizing changes MUST be checked on the WEEK view (10 legs), not the
    // whole-season pool (61) — the per-week sheet is what the page renders,
    // and it is where parlays surface.
    state._droppedParlays = [];
    state._relParlayNote = null;
    // Released-view tickets: built HERE from the released legs at released
    // (or your-book) prices — the presets endpoint's tickets are current-
    // board constructs and don't apply. They only MINT once ~90% of the
    // week's board is out (Austin, 9/6: "10 picks is like 1/3 of a week"
    // — an early-Sunday board would stamp a Best 3-leg that's really just
    // release-order trivia). Numerator: unplayed games with ANY released
    // pick row. Denominator: the week's still-unplayed games. Counted
    // before the invalidated-drop toggle so toggling can't unmint.
    const _wkSched = (state.schedGames || []).filter(g =>
      state.week == null || g.week === state.week);
    const _relCount = (state.releasedGameIds)
      ? _wkSched.filter(g => state.releasedGameIds.has(g.id)).length : null;
    const _share = (_wkSched.length > 0 && _relCount != null)
      ? _relCount / _wkSched.length : null;
    // Feeds still loading (or failed) → conservative absolute floor.
    const _poolGames = new Set(state.legs
      .filter(l => (state.week == null || l.week === state.week))
      .map(l => l.game_id));
    const _relReady = (_share != null ? _share >= 0.85 : _poolGames.size >= 12)
      && _poolGames.size >= 6;
    if (state.boardView === 'released'
        && state.includeParlays && !state.filters.market && !state.filters.tier
        && !_relReady) {
      state._relParlayNote =
        `Released parlays mint once ~85% of the week's board is out — `
        + (_share != null
          ? `${_relCount} of ${_wkSched.length} unplayed games released so far.`
          : `the board is still filling in.`);
    }
    if (state.boardView === 'released' && _relReady
        && state.includeParlays && !state.filters.market && !state.filters.tier) {
      for (const pl of releasedParlays(relLegs)) {
        const p = pl.our_prob, dec = pl.decimal_odds;
        if (!(p > 0) || !(dec > 1)) continue;
        const f = deltaWeight(p, dec) * p;   // cash-frequency, post-compression
        if (!(f > 0)) continue;
        cand.push({ item: pl, is_parlay: true, p, dec,
                    weight: f * Math.pow(dec, beta),
                    edge: null, ev: (p * dec - 1) });
      }
    }
    if (state.boardView === 'current'
        && state.includeParlays && !state.filters.market && !state.filters.tier) {
      for (const rawPl of state.parlays) {
        if (state.week != null && rawPl.week !== state.week) continue;
        const pl = parlayView(rawPl);     // single-book ticket price, or drop
        if (!pl) {
          // Say WHY instead of vanishing. Membership is MARKET-level, not
          // line-level — every surface re-prices at the chosen book's own
          // number, so a ticket only drops when the book isn't posting a
          // leg's market at ALL (verified live: DK had zero WKU-Nevada
          // rows while nine books quoted it, 2026-08-31).
          if (state.book) {
            const MKT_WORD = { spread: 'spread', total: 'total', ml: 'moneyline' };
            const missing = (rawPl.legs || [])
              .filter(l => !(l.other_books || []).some(
                b => b.book && b.book.name === state.book))
              .map(l => l.market === 'total'
                ? `the ${l.matchup || ''} total`.replace('  ', ' ').trim()
                : `the ${l.side || ''} ${MKT_WORD[l.market] || 'market'}`.trim());
            state._droppedParlays.push({
              name: rawPl.name || 'Parlay', missing });
          }
          continue;
        }
        const p = pl.our_prob, dec = pl.decimal_odds;
        if (!(p > 0) || !(dec > 1)) continue;
        const f = deltaWeight(p, dec) * p;   // cash-frequency, post-compression
        if (!(f > 0)) continue;
        cand.push({ item: pl, is_parlay: true, p, dec,
                    weight: f * Math.pow(dec, beta),
                    edge: (pl.edge != null ? pl.edge : null), ev: (p * dec - 1) });
      }
    }

    const totalW = cand.reduce((s, c) => s + c.weight, 0);
    const rows = cand.map(c => {
      const share = totalW > 0 ? c.weight / totalW : 0;   // fraction of the pot
      const stake = amount * share;
      return { ...c, share, stake, payout: stake * c.dec };
    });
    // Biggest slices on top — this is where the preset's tilt shows.
    rows.sort((a, b) => b.stake - a.stake);
    return rows;
  }

  function summaryHTML(rows) {
    const totalStake  = rows.reduce((s, r) => s + r.stake, 0);
    const allWinPay   = rows.reduce((s, r) => s + r.payout, 0);   // if every leg hits
    // Stake-weighted average win probability — the number that actually moves with
    // the weighting: high on Conservative, lower as you tilt toward payouts.
    const avgWin = totalStake > 0
      ? rows.reduce((s, r) => s + r.stake * r.p, 0) / totalStake

    return `
      <div class="al-summary">

        </div>
        <div class="al-summary-stat">
          <span class="al-summary-k">Avg win probability</span>
          <span class="al-summary-v">${(avgWin * 100).toFixed(1)}%</span>
        </div>
        <div class="al-summary-stat">
          <span class="al-summary-k">If every bet wins</span>
          <span class="al-summary-v">$${fmtMoney(allWinPay)}</span>

        <button type="button" class="al-mybets-btn" id="alSendMyBets">Log this sheet in My Bets →</button>

  // ── My Bets handoff ──────────────────────────────────────────
  // Stashes the CURRENT sized sheet (filters, preset, and book view all
  // applied) in localStorage and sends the user to /my-bets.html, where
  // an editable import panel logs the tickets they actually place.
  function sendToMyBets() {
    const rows = computeRows();
    const out = [];
    for (const r of rows) {
      if (!(r.stake >= 0.5)) continue;
      if (r.is_parlay) {
        const pl = r.item;
        const legs = (pl.legs || []).map(l => ({
          game_id: l.game_id, market: l.market, side: l.side_raw,
          side_team: l.side, line: (l.market === 'ml' ? null : l.line_raw),
          odds: l.price_american,
          side_label: (l.market === 'ml' ? `${l.side} ML` : `${l.side} ${l.line}`),
          game_label: l.matchup, kickoff: l.kickoff, week: l.week,
        }));
        if (legs.length < 2 || legs.some(l => !l.side || l.odds == null || l.game_id == null)) continue;
        const kicks = legs.map(l => l.kickoff).filter(Boolean).sort();
        out.push({
          type: 'parlay', odds: pl.price_american, stake: Math.round(r.stake),
          book: (pl.book && pl.book.name) || null, legs,
          week: Math.min(...legs.map(l => l.week).filter(w => w != null)),
          kickoff: kicks[0] || null,
        });
      } else {
        const l = r.item;
        if (l.game_id == null || l.price_american == null || !l.side_raw) continue;
        out.push({
          type: 'single', game_id: l.game_id, week: l.week, kickoff: l.kickoff,
          market: l.market, side: l.side_raw, side_team: l.side,
          line: (l.market === 'ml' ? null : l.line_raw),
          odds: l.price_american, book: (l.book && l.book.name) || null,
          stake: Math.round(r.stake),
          side_label: (l.market === 'ml' ? `${l.side} ML` : `${l.side} ${l.line}`),
          game_label: l.matchup,
        });
      }
    }
    if (!out.length) return;
    try {
      localStorage.setItem('pb_mybets_import', JSON.stringify({
        at: Date.now(), amount: Number(state.amount) || 0,
        book: state.book || null, rows: out,
      }));
    } catch (e) { return; }
    location.href = '/my-bets.html';
  }

  // Book allocator: sum every bet's stake by the book its "Bet at X" button
  // points to, so the user knows how much to have at each sportsbook. A bet with
  // no listed book is grouped under a clear catch-all.
  function bookTotalsHTML(rows) {
    if (!rows.length) return '';
    // Single-book mode: everything is at one book by definition — a
    // one-row "what to have at each book" table is just noise.
    if (state.book) return '';
    const totals = new Map(), urls = new Map();
    for (const r of rows) {
      const b = r.item.book;
      const name = (b && b.name) ? b.name : 'No book listed';
      totals.set(name, (totals.get(name) || 0) + r.stake);
      if (b && b.url && !urls.has(name)) urls.set(name, b.url);
    }
    const arr = [...totals.entries()].sort((a, b) => b[1] - a[1]);
    const rowsHTML = arr.map(([name, amt]) => {
      const url = urls.get(name);
      const nameHTML = url
        ? `<a class="al-books-name" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>`
        : `<span class="al-books-name">${esc(name)}</span>`;
      return `<div class="al-books-row">${nameHTML}<span class="al-books-amt">$${fmtMoney(amt)}</span></div>`;
    }).join('');
    return `
      <div class="al-books">
        <div class="al-books-title">What to have at each book</div>
        ${rowsHTML}
      </div>`;
  }

  function bookRowHTML(b) {
    if (!b || !b.book) return '';
    const url  = b.book.url || '#';
    const name = esc(b.book.name || '?');
    const line = esc(b.line || '');
    const deltaClass =
      b.delta === 'match' ? 'll-book-delta--match'

            <path d="M6 4h6v6M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

    const betBtn = (leg.book && leg.book.url)
      ? `<a class="ll-bet-button al-bet" href="${esc(leg.book.url)}" target="_blank" rel="noopener noreferrer"
            aria-label="Bet at ${esc(leg.book.name)} (opens in new tab)">Bet $${fmtMoney(r.stake)} at ${esc(leg.book.name)}${leg.price_american != null ? ' ' + price : ''} \u2192</a>`
      : '';
    return `
      <article class="ll-row al-card" aria-expanded="false">
        <button type="button" class="al-head" data-action="toggle-card" aria-expanded="false">
          ${renderBadge(leg.tier, leg.bolt)}
          <div class="ll-row-content">
            <div class="ll-row-matchup">${esc(leg.matchup || '\u2014')}</div>
            <div class="ll-row-pick">${pickText(leg)}</div>
            ${(() => {
              // ONE chip language on both views: released \u2192 the price on
              // THIS row. The journal's tracked-quote marker is gone from
              // the allocator (it printed numbers no row was selling).
              const mv = leg._relMove !== undefined ? leg._relMove
                : (leg.released
                    ? (leg.market === 'ml'
                        ? mlPayMove(leg.released.price_american, leg.price_american)
                        : relMove(leg))
                    : null);
              return mv ? renderRelMove(mv) : '';
            })()}
          </div>
          <div class="al-metrics">
            <div class="al-metric"><span class="al-metric-k">Win prob</span><span class="al-metric-v">${(r.p * 100).toFixed(1)}%</span></div>
            <div class="al-metric"><span class="al-metric-k">Clears at</span><span class="al-metric-v">${(100 / r.dec).toFixed(1)}%</span></div>
            <div class="al-metric"><span class="al-metric-k">Price</span><span class="al-metric-v">${price}</span></div>
            <div class="al-metric"><span class="al-metric-k">Returns if it hits</span><span class="al-metric-v al-pos">$${fmtMoney(r.payout)}</span></div>
          </div>
          <div class="al-stake">
            <div class="al-stake-amt">$${fmtMoney(r.stake)}</div>
            <div class="al-stake-lbl">${(r.share * 100).toFixed(1)}% of pot</div>
          </div>
          <svg class="ll-row-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="ll-accordion">
          ${otherBooksHTML(leg)}
          ${betBtn}
        </div>
      </article>`;
  }

  function parlayRowHTML(r) {
    const pl = r.item;
    const price = pl.price_american != null ? fmtSigned(pl.price_american) : '\u2014';
    const betBtn = (pl.book && pl.book.url)
      ? `<a class="ll-bet-button al-bet" href="${esc(pl.book.url)}" target="_blank" rel="noopener noreferrer"
            aria-label="Bet at ${esc(pl.book.name)} (opens in new tab)">Bet $${fmtMoney(r.stake)} at ${esc(pl.book.name)}${pl.price_american != null ? ' ' + price : ''} \u2192</a>`
      : '';
    const tbName = pl.book && pl.book.name;
    const legsHTML = (pl.legs || []).map(l => parlayLegHTML(l, tbName)).join('');
    return `
      <article class="ll-row al-card al-card-parlay" aria-expanded="false">
        <button type="button" class="al-head" data-action="toggle-card" aria-expanded="false">
          ${parlayBadge(pl)}
          <div class="ll-row-content">
            <div class="ll-row-matchup">${esc(pl.name || 'Parlay')} parlay</div>
            <div class="ll-row-pick">${pl.leg_count || (pl.legs || []).length} legs \u00b7 <span class="ll-row-pick-num">${price}</span>${tbName ? ' \u00b7 ' + esc(tbName) : ''}</div>
          </div>
          <div class="al-metrics">
            <div class="al-metric"><span class="al-metric-k">Hit prob</span><span class="al-metric-v">${(r.p * 100).toFixed(1)}%</span></div>
            <div class="al-metric"><span class="al-metric-k">Odds</span><span class="al-metric-v">${price}</span></div>
            <div class="al-metric"><span class="al-metric-k">Returns if it hits</span><span class="al-metric-v al-pos">$${fmtMoney(r.payout)}</span></div>
          </div>
          <div class="al-stake">
            <div class="al-stake-amt">$${fmtMoney(r.stake)}</div>
            <div class="al-stake-lbl">${(r.share * 100).toFixed(1)}% of pot</div>
          </div>
          <svg class="ll-row-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="ll-accordion">
          <div class="ll-accordion-section-label" style="margin:0 0 var(--space-2);">The ${pl.leg_count || (pl.legs || []).length} legs</div>
          ${legsHTML}
          ${betBtn}
        </div>
      </article>`;
  }

  function rowHTML(r) {
    return r.is_parlay ? parlayRowHTML(r) : straightRowHTML(r);
  }

  function listHTML(rows) {
    const dropped = (state._droppedParlays || []);
    const droppedNote = (dropped.length ? `
      <div class="al-dropped-note">${dropped.map(d =>
        `<b>${esc(d.name)}</b> can't be built at ${esc(state.book)} — ` +
        (d.missing.length
          ? `it isn't posting ${esc(d.missing.join(' or '))} right now (any line would do)`
          : `no full-ticket price there`)
      ).join('<br>')}</div>` : '')
      + (state._relParlayNote
        ? `<div class="al-dropped-note">${esc(state._relParlayNote)}</div>` : '');
    if (!rows.length) {
      const amount = Number(state.amount) || 0;
      if (!(amount > 0)) return `<div class="al-empty">Enter an amount above to split across the board.</div>` + droppedNote;
      return `<div class="al-empty">Nothing beats its price under these filters right now. Try clearing a filter or switching weeks.</div>` + droppedNote;
    }
    return rows.map(rowHTML).join('') + droppedNote;
  }

  // ── Loading skeleton (matches parlay's .ll-skeleton shimmer) ──
  function skelCardHTML() {
    const metric = (kw, vw) =>
      `<div class="al-metric"><span class="ll-skeleton" style="width:${kw}px;height:9px;margin-bottom:4px;"></span><span class="ll-skeleton" style="width:${vw}px;height:13px;"></span></div>`;
    return `
      <article class="ll-row al-card" aria-hidden="true">
        <div class="al-head" style="cursor:default;">
          <span class="ll-skeleton ll-skeleton--badge"></span>
          <div class="ll-row-content" style="flex:1 1 auto;">
            <div class="ll-skeleton ll-skeleton--line-a"></div>
            <div class="ll-skeleton ll-skeleton--line-b"></div>
          </div>
          <div class="al-metrics">
            ${metric(46, 38)}${metric(34, 30)}${metric(62, 44)}
          </div>
          <div class="al-stake">
            <span class="ll-skeleton" style="width:58px;height:18px;"></span>
          </div>
        </div>
      </article>`;
  }
  function loadingHTML() {
    const stat = (kw, vw) =>
      `<div class="al-summary-stat"><span class="ll-skeleton" style="width:${kw}px;height:9px;"></span><span class="ll-skeleton" style="width:${vw}px;height:20px;"></span></div>`;
    return `
      ${introHTML()}
      <div class="al-summary" aria-hidden="true">
        ${stat(72, 64)}${stat(28, 26)}${stat(96, 44)}${stat(70, 58)}
      </div>
      <div id="al-results">
        ${skelCardHTML()}${skelCardHTML()}${skelCardHTML()}${skelCardHTML()}
      </div>`;
  }

  // ── Top-level render ─────────────────────────────────────────
  function render() {
    if (state.loading) {
      root.innerHTML = loadingHTML();
      return;
    }
    if (state.error) {
      root.innerHTML = `${introHTML()}<div class="al-empty">Couldn't load the board. Refresh to try again.</div>`;
      return;
    }
    const rows = computeRows();
    root.innerHTML = `
      ${introHTML()}
      ${controlsHTML()}
      ${weekTabsHTML()}
      ${filtersHTML()}
      <div id="al-summary">${summaryHTML(rows)}</div>
      <div id="al-books-wrap">${bookTotalsHTML(rows)}</div>
      <div id="al-results">${listHTML(rows)}</div>`;
    bindInputs();
  }

  // Recompute only the summary + book totals + list (on text input, keeps focus).
  function recompute() {
    const rows = computeRows();
    const s = document.getElementById('al-summary');
    const bw = document.getElementById('al-books-wrap');
    const l = document.getElementById('al-results');
    if (s) s.innerHTML = summaryHTML(rows);
    if (bw) bw.innerHTML = bookTotalsHTML(rows);
    if (l) l.innerHTML = listHTML(rows);
  }

  // Delegated: summaryHTML renders from BOTH the full render() template and
  // the recompute() partial — a per-render binding missed the first paint
  // and left the button dead until an input changed.
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'alSendMyBets') sendToMyBets();
  });

  function bindInputs() {
    const amt = document.getElementById('al-amount');
    if (amt) {
      amt.addEventListener('input', () => {
        const digits = amt.value.replace(/[^0-9]/g, '');
        state.amount = digits ? parseInt(digits, 10) : 0;
        recompute();
      });
      amt.addEventListener('blur', () => { amt.value = fmtMoney(state.amount); });
    }
    const bookSel = document.getElementById('al-book');
    if (bookSel) {
      bookSel.addEventListener('change', () => {
        state.book = bookSel.value || null;
        try {
          if (state.book) localStorage.setItem('al_book', state.book);
          else localStorage.removeItem('al_book');
        } catch (e) { /* private mode — the choice just won't persist */ }
        render();   // full render: the hint line and books section change too
      });
    }
  }

  // ── Paywall (mirrors parlay copy/markup) ─────────────────────
  function renderPaywall() {
    root.innerHTML = `
      <header class="ll-paywall-header">
        <div class="ll-paywall-eyebrow">— Bankroll Allocator</div>
        <h1 class="ll-paywall-headline">
          <span class="ll-paywall-headline-1">Your bet,</span>
          <span class="ll-paywall-headline-2">divvied up.</span>
        </h1>
        <p class="ll-paywall-body">
          Enter what you want to wager, choose Conservative, Moderate, or Aggressive,
          and every play on the board gets a slice — leaning safe, chasing payouts, or
          splitting the difference. Updates as the board re-grades against the line.
        </p>
      </header>

      <div class="ll-paywall-blur">
        <article class="ll-row"><div class="ll-row-header">
          <span class="ll-badge ll-badge--A">A</span>
          <div class="ll-row-content">
            <div class="ll-row-matchup">Sample Matchup A</div>
            <div class="ll-row-pick">Team +7 · FanDuel</div>
          </div>
        </div></article>
        <article class="ll-row"><div class="ll-row-header">
          <span class="ll-badge ll-badge--B">B</span>
          <div class="ll-row-content">
            <div class="ll-row-matchup">Sample Matchup B</div>
            <div class="ll-row-pick">Under 54.5 · DraftKings</div>
          </div>
        </div></article>
        <div class="ll-paywall-fade"></div>
      </div>

      <div class="ll-paywall-card">
        <h2 class="ll-paywall-card-headline">See every pick.<br>Sized to your bankroll.</h2>
        <p class="ll-paywall-card-subhead">Release pricing through Aug 22. Locked for as long as you're subscribed. Same access on every plan.</p>
        <p class="ll-paywall-first-charge" style="font-style:italic;color:#B8922A;font-size:var(--text-sm);margin:10px 0 0;">First charge is anchored to Aug 23.</p>
        <div class="ll-paywall-plans">
          <div class="ll-paywall-plan">
            <div class="ll-paywall-plan-name">Weekly</div>
            <div class="ll-paywall-plan-price">$5.99/wk<br><span class="ll-paywall-plan-release">release $3.99</span></div>
          </div>
          <div class="ll-paywall-plan ll-paywall-plan--featured">
            <div class="ll-paywall-plan-badge">Most Picked</div>
            <div class="ll-paywall-plan-name">Monthly</div>
            <div class="ll-paywall-plan-price">$18.99/mo<br><span class="ll-paywall-plan-release">release $11.99</span></div>
          </div>
          <div class="ll-paywall-plan">
            <div class="ll-paywall-plan-name">Season Pass</div>
            <div class="ll-paywall-plan-price">$49.99<br><span class="ll-paywall-plan-release">release $34.99</span></div>
          </div>
        </div>
        <a class="ll-paywall-cta" href="/subscribe.html">Get the picks →</a>
        <div class="ll-paywall-footer">Cancel anytime. No upsells. Same access on every plan.</div>
      </div>
    `;
  }

  // ── Events (delegated; pills + week tabs) ────────────────────
  document.addEventListener('click', (e) => {
    const head = e.target.closest('[data-action="toggle-card"]');
    if (head) {
      const row = head.closest('.ll-row');
      const open = row.getAttribute('aria-expanded') === 'true';
      row.setAttribute('aria-expanded', open ? 'false' : 'true');
      head.setAttribute('aria-expanded', open ? 'false' : 'true');
      return;
    }

    const parToggle = e.target.closest('[data-action="toggle-parlays"]');
    if (parToggle) {
      state.includeParlays = !state.includeParlays;
      render();   // reflect the toggle at once
      if (state.includeParlays && !state.parlays.length) {
        fetchParlays().then(render).catch(() => {});
      }
      return;
    }

    const viewPill = e.target.closest('.ll-filter-pill[data-view]');
    if (viewPill) {
      state.boardView = viewPill.dataset.view === 'released' ? 'released' : 'current';
      try { localStorage.setItem('al_view', state.boardView); } catch (err) {}
      render();
      return;
    }

    const dropInv = e.target.closest('[data-action="toggle-dropinv"]');
    if (dropInv) {
      state.dropInvalidated = !state.dropInvalidated;
      try { localStorage.setItem('al_drop_inv', state.dropInvalidated ? '1' : '0'); } catch (err) {}
      render();
      return;
    }

    const excl = e.target.closest('.al-book-chip[data-excl]');
    if (excl) {
      const name = excl.dataset.excl;
      if (state.excluded.has(name)) state.excluded.delete(name);
      else state.excluded.add(name);
      // A book you can't bet can't be your single book either.
      if (state.book && state.excluded.has(state.book)) {
        state.book = null;
        try { localStorage.removeItem('al_book'); } catch (err) {}
      }
      try { localStorage.setItem('al_excluded_books',
                                 JSON.stringify([...state.excluded])); }
      catch (err) { /* private mode — the exclusion just won't persist */ }
      render();   // chips, hint, dropdown options and every stake change
      return;
    }

    const preset = e.target.closest('.al-preset-pill[data-preset]');
    if (preset) { state.presetKey = preset.dataset.preset; render(); return; }

    const fpill = e.target.closest('.ll-filter-pill[data-filter]');
    if (fpill && !fpill.classList.contains('al-preset-pill')) {
      const key = fpill.dataset.filter;
      const f = state.filters;
      if (key === 'all') { f.market = null; f.tier = null; }
      else if (key.startsWith('tier:')) {
        const t = key.slice(5);
        f.tier = (f.tier === t) ? null : t;
        f.market = null;
      } else {
        f.market = (f.market === key) ? null : key;
        f.tier = null;
      }
      render();
      return;
    }

    const wtab = e.target.closest('.ll-week-tab[data-week]');
    if (wtab) {
      state.week = Number(wtab.dataset.week);
      state.parlays = [];   // clear last week's tickets so they don't linger
      render();             // new week's straights show immediately
      // Parlays are single-slate; refresh them for the new week in the background.
      fetchParlays().then(render).catch(() => {});
      return;
    }
  });

  // ── Init ─────────────────────────────────────────────────────
  render();          // paint intro + loading immediately
  fetchBoard();
})();
</script>
