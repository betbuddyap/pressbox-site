<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); min-height: 100vh; }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }

  /* PAGE HEADER (upcoming idiom — the current header language: cream,
     gold-dash eyebrow, ink serif title; the ink block is retired) */
  .page-header { background: var(--cream); padding: 48px 0 32px; border-bottom: 1px solid var(--border); }
  .page-header-inner { max-width: var(--max); margin: 0 auto; padding: 0 32px; }
  .page-eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .page-eyebrow::before { content: ''; display: block; width: 20px; height: 1px; background: var(--gold); }
  .page-title { font-family: var(--serif); font-size: 42px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .page-title em { font-style: italic; color: var(--gold); }
  .page-sub { font-size: 14px; font-weight: 300; color: var(--text-mid); margin-top: 8px; line-height: 1.6; }

  /* CONTROLS (rankings bar idiom) */
  .tm-bar { background: var(--cream); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90; }
  .tm-bar-inner { max-width: var(--max); margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .tm-conf-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .tm-conf-label { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-light); }
  .tm-conf { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); background: var(--cream); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; outline: none; cursor: pointer; }
  .tm-conf:focus { border-color: var(--gold); }
  .tm-search { font-family: var(--sans); font-size: 13px; color: var(--text); background: var(--cream); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; width: 220px; outline: none; }
  .tm-search::placeholder { color: var(--text-light); }
  .tm-search:focus { border-color: var(--gold); }

  /* MAIN */
  .tm-main { max-width: var(--max); margin: 0 auto; padding: 28px 32px 80px; }
  .tm-provenance { font-family: var(--sans); font-size: 12px; color: var(--text-light); margin-bottom: 18px; }

  /* CONFERENCE SECTION */
  .tm-conf-section { margin-bottom: 40px; }
  .tm-conf-header { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
  .tm-conf-name { font-family: var(--serif); font-size: var(--text-xl); font-weight: 700; color: var(--text); }
  .tm-conf-count { font-family: var(--sans); font-size: var(--text-sm); color: var(--text-light); }
  .tm-conf-line { flex: 1; height: 1px; background: var(--border); }

  /* TEAM LIST (rankings row idiom) */
  .tm-list { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--cream); overflow: hidden; }
  .tm-listhead { display: grid; grid-template-columns: 44px 1fr 84px 96px 64px; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--cream-dark); }
  .tm-listhead span { font-family: var(--sans); font-size: var(--text-eyebrow); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-light); }
  .tm-listhead .num { text-align: right; }
  .tm-row { display: grid; grid-template-columns: 44px 1fr 84px 96px 64px; gap: 12px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--border); text-decoration: none; transition: background var(--transition-fast); }
  .tm-row:last-child { border-bottom: none; }
  .tm-row:hover { background: var(--cream-dark); }
  .tm-rank { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--gold-deep); font-variant-numeric: tabular-nums; }
  .tm-name { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm-name .conf-tag { font-family: var(--sans); font-size: var(--text-micro); font-weight: 600; color: var(--text-light); margin-left: 8px; }
  .tm-rec, .tm-proj, .tm-rating { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .tm-proj { color: var(--text-mid); }
  .tm-rec .sub, .tm-proj .sub { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-light); }

  /* STATES */
  .tm-state { text-align: center; padding: 80px 24px; }
  .tm-state-title { font-family: var(--serif); font-size: var(--text-xl); font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .tm-state-sub { font-family: var(--sans); font-size: 14px; color: var(--text-light); line-height: 1.6; }
  .tm-skel { height: 56px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, rgba(26,23,5,0.03) 25%, rgba(26,23,5,0.06) 50%, rgba(26,23,5,0.03) 75%); background-size: 200% 100%; animation: tm-shimmer 1.3s ease-in-out infinite; }
  @keyframes tm-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  @media (max-width: 720px) {
    .page-header { padding: 36px 0 26px; }
    .page-header-inner { padding: 0 18px; }
    .page-title { font-size: 32px; }
    .tm-bar-inner { padding: 0 18px; flex-wrap: wrap; }
    .tm-search { width: 100%; }
    .tm-main { padding: 22px 18px 64px; }
    .tm-listhead { display: none; }
    .tm-row { grid-template-columns: 36px 1fr 74px; }
    .tm-proj, .tm-rating { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .tm-skel { animation: none; } }
</style>

<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">

    </a>
  </div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <div class="page-eyebrow">FBS · 2026</div>
    <h1 class="page-title">The <em>Teams</em></h1>
    <p class="page-sub">Every FBS program — record, rating, and projected season off the four-model board. Pick a team for the full page.</p>
  </div>
</div>

<!-- CONTROLS -->
<div class="tm-bar">
  <div class="tm-bar-inner">
    <div class="tm-conf-wrap">
      <span class="tm-conf-label">Conference</span>
      <select class="tm-conf" id="tmConf" aria-label="Filter by conference"></select>
    </div>
    <input class="tm-search" id="tmSearch" type="search" placeholder="Find a team…" aria-label="Find a team">
  </div>
</div>

<!-- MAIN -->
<main class="tm-main">
  <div class="tm-provenance" id="tmProvenance"></div>
  <div id="tmBody">
    <div class="tm-skel"></div><div class="tm-skel"></div><div class="tm-skel"></div>
    <div class="tm-skel"></div><div class="tm-skel"></div><div class="tm-skel"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth-nav.js" defer></script>
<script>
const API = 'https://betbuddy-backend.onrender.com';
const SEASON = 2026;

const state = { conf: 'All FBS', q: '', payload: null };
const els = {
  body: document.getElementById('tmBody'),
  conf: document.getElementById('tmConf'),
  search: document.getElementById('tmSearch'),
  provenance: document.getElementById('tmProvenance'),
};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Actual W-L from the season rows' played games (the board locks results).
function actualRecord(t) {
  const g = Array.isArray(t.season) ? t.season : [];
  const w = g.filter(x => x.played && x.result === 'W').length;
  const l = g.filter(x => x.played && x.result === 'L').length;
  return `${w}-${l}`;
}

function teamHref(name) { return `/team.html?team=${encodeURIComponent(name)}`; }

function render() {
  const p = state.payload;
  if (!p) return;
  let teams = (p.teams || []).slice().sort((a, b) => b.rating - a.rating);
  const rankOf = {};
  teams.forEach((t, i) => { rankOf[t.team] = i + 1; });

  const q = state.q.trim().toLowerCase();
  if (q) teams = teams.filter(t => t.team.toLowerCase().includes(q));
  if (state.conf !== 'All FBS') teams = teams.filter(t => t.conference === state.conf);

  if (!teams.length) {
    els.body.innerHTML = `<div class="tm-state"><div class="tm-state-title">No teams match.</div>
      <div class="tm-state-sub">Try a different search or conference.</div></div>`;
    return;
  }

  const rowHTML = t => `
    <a class="tm-row" href="${teamHref(t.team)}">
      <span class="tm-rank">${rankOf[t.team]}</span>
      <span class="tm-name">${escapeHtml(t.team)}${q ? `<span class="conf-tag">${escapeHtml(t.conference || '')}</span>` : ''}</span>
      <span class="tm-rec">${actualRecord(t)}</span>
      <span class="tm-proj">${escapeHtml(t.proj_record || '—')}</span>
      <span class="tm-rating">${t.rating == null ? '—' : t.rating.toFixed(1)}</span>
    </a>`;

  const head = `
    <div class="tm-listhead">
      <span>Rk</span><span>Team</span><span class="num">Record</span>
      <span class="num">Projected</span><span class="num">Rating</span>
    </div>`;

  // Searching or a single conference → one flat list; otherwise grouped by
  // conference in the board's own order.
  if (q || state.conf !== 'All FBS') {
    els.body.innerHTML = `<div class="tm-list">${head}${teams.map(rowHTML).join('')}</div>`;
    return;
  }
  const confs = p.conferences && p.conferences.length
    ? p.conferences : [...new Set(teams.map(t => t.conference))];
  els.body.innerHTML = confs.map(c => {
    const group = teams.filter(t => t.conference === c);
    if (!group.length) return '';
    return `
      <section class="tm-conf-section">
        <div class="tm-conf-header">
          <h2 class="tm-conf-name">${escapeHtml(c)}</h2>
          <span class="tm-conf-count">${group.length} teams</span>
          <span class="tm-conf-line"></span>
        </div>
        <div class="tm-list">${head}${group.map(rowHTML).join('')}</div>
      </section>`;
  }).join('');
}

function buildConfSelect() {
  const p = state.payload;
  const confs = p.conferences && p.conferences.length
    ? p.conferences : [...new Set((p.teams || []).map(t => t.conference))];
  els.conf.innerHTML = ['All FBS', ...confs]
    .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

els.conf.addEventListener('change', () => { state.conf = els.conf.value; render(); });
els.search.addEventListener('input', () => { state.q = els.search.value; render(); });

fetch(`${API}/rankings/teams?season=${SEASON}&offseason=1`)
  .then(r => { if (!r.ok) throw new Error(`board ${r.status}`); return r.json(); })
  .then(p => {
    state.payload = p;
    els.provenance.textContent =
      `${(p.teams || []).length} FBS teams · four-model blend · rebuilt after every game weekend`;
    buildConfSelect();
    render();
  })
  .catch(() => {
    els.body.innerHTML = `<div class="tm-state"><div class="tm-state-title">The board is rebuilding.</div>
      <div class="tm-state-sub">Give it a moment and refresh — rankings recompute after every data pull.</div></div>`;
  });
</script>
